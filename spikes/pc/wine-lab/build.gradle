plugins { id 'com.android.application' version '8.7.1' }
android {
    namespace 'dev.cartdeck.pc.winelab'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.cartdeck.pc.winelab'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName 'PC-R06B-translator'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.assets.srcDirs = [providers.gradleProperty("wineLabAssets").get()]
    sourceSets.main.jniLibs.srcDirs = [providers.gradleProperty("wineLabNative").get()]
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/*.so'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
