name: CARTDECK Dreamcast Android ARM64 native build

on:
  pull_request:
    paths:
      - ".github/workflows/cartdeck-dreamcast-spike.yml"
      - "spikes/dreamcast/**"
      - "scripts/ci/build_dreamcast_upstream_core.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disc-identity:
    name: Dreamcast descriptor safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run conservative disc identification tests
        run: python3 -m unittest discover -s spikes/dreamcast -p 'test_*.py' -v

  flycast-arm64:
    name: Build upstream Flycast libretro ARM64 (isolated, not packaged)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FLYCAST_SOURCE_SHA: 1b7c7d63b73ea6987fb23f9334a7d597401a50f8
      ANDROID_NDK_VERSION: 29.0.14206865
      ANDROID_ABI: arm64-v8a
      ANDROID_API: "28"
    steps:
      - uses: actions/checkout@v4
      - name: Check repository remains free of bundled Flycast binaries and BIOS
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(dc_boot\.bin|dc_flash\.bin|flycast.*\.so)$'; then
            echo "::error::Do not commit Dreamcast firmware or Flycast binaries to this research branch"
            exit 1
          fi
      - name: Configure Android NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "ndk;$ANDROID_NDK_VERSION"
          test -f "$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION/build/cmake/android.toolchain.cmake"
      - name: Build pinned GLES3 core with provenance and 16 KB checks
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          scripts/ci/build_dreamcast_upstream_core.sh "$RUNNER_TEMP/flycast-output"
          cat "$RUNNER_TEMP/flycast-output/provenance.txt" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/flycast-output/sha256.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "Native build pass is not an Android runtime or gameplay pass." >> "$GITHUB_STEP_SUMMARY"
      - name: Distribution boundary
        if: always()
        run: |
          echo "No native binary, firmware, ROM or APK is publicly uploaded. Private APK staging uses the output and its matching provenance manifest." >> "$GITHUB_STEP_SUMMARY"
