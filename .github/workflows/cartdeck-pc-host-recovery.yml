name: CARTDECK deprecated PC host recovery
# Intentionally no PR trigger. The production console host is not a PC lab.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo 'Retired. Use cartdeck-pc-native-lab.yml instead.'
          exit 1
