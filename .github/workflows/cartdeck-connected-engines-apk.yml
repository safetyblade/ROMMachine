name: CARTDECK connected native engines APK

on:
  workflow_call:
    inputs:
      recovery_native_run_id:
        type: string
        default: ""
      xenia_reuse_verified_xgfx01:
        type: boolean
        default: false
      pc_host_native_run_id:
        type: string
        default: ""
      pc_host_reuse_run_id:
        type: string
        default: ""
      pc_host_reuse_artifact_name:
        type: string
        default: ""
      measure_apk_reuse:
        type: boolean
        default: false
      distribution_licensing_cleared:
        type: boolean
        default: false
      ps3_development_integration:
        type: boolean
        default: false
      ps3_owner_test:
        type: boolean
        default: false
      include_ps3:
        type: boolean
        default: false
      ps3_run_id:
        type: string
        default: ""
      publish_apk:
        type: boolean
        default: true
      use_ci01_native_set:
        type: boolean
        default: false
      use_ci01_all_native:
        type: boolean
        default: false
    secrets:
      CARTDECK_OWNER_TEST_PASSPHRASE:
        required: false
  workflow_dispatch:
    inputs:
      measure_apk_reuse:
        description: 'Measure clean-output and same-workspace repeat APK builds; retain dependency caches'
        type: boolean
        default: false
      use_ci01_all_native:
        description: 'Verify and reuse ten individually built native components (CI-01 trial)'
        type: boolean
        default: false
      use_ci01_native_set:
        description: 'Validate and substitute five independent, provenance-verified native inputs'
        type: boolean
        default: false
      native_rebuild_authorized:
        description: 'Explicitly authorize complete pinned-source native rebuild (legacy recovery only)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  connected-apk:
    name: Build connected CARTDECK ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CARTDECK_APK_MAX_MIB: '256'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enforce PS3 development and distribution boundaries
        if: inputs.include_ps3 == true && inputs.distribution_licensing_cleared != true && (inputs.ps3_development_integration != true || inputs.publish_apk == true)
        run: |
          echo '::error::PS3: use explicitly authorised compile-only development mode without APK publication, or record actual distribution clearance.'
          exit 1
      - name: Check owner-only PS3 delivery prerequisites
        if: inputs.ps3_owner_test
        env:
          OWNER_TEST_PASSPHRASE: ${{ secrets.CARTDECK_OWNER_TEST_PASSPHRASE }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            push|workflow_dispatch) ;;
            *) echo 'Owner-test packaging requires a trusted master build.' >&2; exit 1 ;;
          esac
          test "$GITHUB_REF" = refs/heads/master
          test "${{ inputs.include_ps3 }}" = true
          test "${{ inputs.ps3_development_integration }}" = true
          test "${{ inputs.publish_apk }}" = false
          if (( ${#OWNER_TEST_PASSPHRASE} < 24 )); then
            echo '::error::Set repository secret CARTDECK_OWNER_TEST_PASSPHRASE (at least 24 characters) before starting an owner test.'
            exit 1
          fi
          command -v 7z >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y p7zip-full; }
      - name: Native resolver source tests (before native downloads)
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_ci01_legacy_engines.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_ci01_remaining_engines.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_resolve_native_artifacts.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_issue_native_receipt.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_ci01_ps1.py' -v
      - name: Early source formatting gate (before native downloads and compilation)
        run: |
          bash scripts/ci/bootstrap_gradle.sh
          gradle_bin="$(sed -n 's/^GRADLE_BIN=//p' "$GITHUB_ENV" | tail -n 1)"
          test -x "$gradle_bin"
          "$gradle_bin" ktlintCheck --continue --no-daemon --no-configuration-cache --max-workers=2
      - name: Resolve legacy inputs by named component, not fixed artifact IDs
        id: inputs
        uses: actions/github-script@v7
        with:
          script: |
            // Temporary compatibility catalog for native backends awaiting CI-01 receipts.
            // Do not infer provenance from a name: all downloaded outputs still pass the
            // existing native staging/ELF/package checks before APK publication.
            const useAll = '${{ inputs.use_ci01_all_native }}' === 'true';
            const useFive = '${{ inputs.use_ci01_native_set }}' === 'true';
            const groups = [
              {run: 43598603237, names: [
                ...(!useAll ? ['hakux-android-backend', 'xenia-android-backend',
                'patched-libretrodroid-host'] : []),
                ...(!(useFive || useAll) ? [
                  'native-engine-ps1', 'native-engine-psp', 'native-engine-dc',
                  'native-engine-gc', 'native-engine-ps2'] : [])]},
              {run: 43595931102, names: useAll ? [] : ['ps2-armsx2-native-verified-private']},
              {run: 43601391744, names: useAll ? [] : ['wiiu-cemu-verified-arm64-core-private-not-an-apk']}
            ];
            const missing = [];
            for (const group of groups) {
              if (!group.names.length) continue;
              const run = (await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: group.run
              })).data;
              if (run.conclusion !== 'success') {
                missing.push(...group.names.map(name => name + ': source run not successful'));
                continue;
              }
              const list = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: group.run, per_page: 100
              });
              for (const name of group.names) {
                const found = list.find(a => a.name === name && !a.expired);
                if (!found) missing.push(name + ': missing or expired');
              }
            }
            core.setOutput('reuse', String(missing.length === 0));
            core.setOutput('missing', JSON.stringify(missing));
            core.summary.addHeading('Legacy native component inventory');
            core.summary.addRaw(missing.length ? missing.join('\\n') :
              'All named legacy inputs retained; downstream native package verification remains mandatory.');
            await core.summary.write();
            if (missing.length) core.warning('Missing native components: ' + missing.join('; '));
      - name: Stop before expensive native compilation without explicit authorization
        if: steps.inputs.outputs.reuse != 'true' && inputs.native_rebuild_authorized != true
        run: |
          echo '::error::Missing or expired native inputs. Routine APK builds must not rebuild every engine. Rebuild the missing components in their engine workflows and provide verified artifacts; use native_rebuild_authorized only for a deliberate complete recovery.'
          exit 1
      - name: Download the passed five-engine, Wii, hakuX and Xenia builds
        if: steps.inputs.outputs.reuse == 'true' && inputs.use_ci01_native_set != true && inputs.use_ci01_all_native != true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43598603237
          pattern: native-engine-*
          path: work/connected/legacy
      - uses: actions/download-artifact@v4
        if: steps.inputs.outputs.reuse == 'true' && inputs.use_ci01_all_native != true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43598603237
          name: hakux-android-backend
          path: work/connected/hakux
      - uses: actions/download-artifact@v4
        if: steps.inputs.outputs.reuse == 'true' && inputs.use_ci01_all_native != true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43598603237
          name: xenia-android-backend
          path: work/connected/xenia
      - uses: actions/download-artifact@v4
        if: steps.inputs.outputs.reuse == 'true' && inputs.use_ci01_all_native != true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43598603237
          name: patched-libretrodroid-host
          path: work/connected/host
      - name: Download both passed genuine ARMSX2 page models
        if: steps.inputs.outputs.reuse == 'true' && inputs.use_ci01_all_native != true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43595931102
          name: ps2-armsx2-native-verified-private
          path: work/connected/armsx2
      - name: Download the passed Cemu core and Vulkan host build
        if: steps.inputs.outputs.reuse == 'true' && inputs.use_ci01_all_native != true
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43601391744
          name: wiiu-cemu-verified-arm64-core-private-not-an-apk
          path: work/connected/cemu
      - name: Resolve successful independent engine workflow runs
        if: inputs.use_ci01_native_set == true || inputs.use_ci01_all_native == true
        id: ci01_set
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const engines = ['ps1', 'psp', 'dc', 'gc', 'ps2'];
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const runCache = new Map();
            for (const engine of engines) {
              const prefix = 'native-ci01-' + engine + '-';
              const candidates = artifacts.filter(a => !a.expired && a.name.startsWith(prefix))
                .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
              let selected = null;
              for (const artifact of candidates) {
                const id = artifact.workflow_run?.id;
                if (!id) continue;
                if (!runCache.has(id)) {
                  const response = await github.rest.actions.getWorkflowRun({...context.repo, run_id: id});
                  runCache.set(id, response.data);
                }
                const run = runCache.get(id);
                if (run.conclusion !== 'success' || run.event !== 'workflow_dispatch' ||
                    run.path !== '.github/workflows/cartdeck-ci01-native-engine.yml' ||
                    run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo ||
                    artifact.name !== prefix + run.head_sha) continue;
                selected = {run_id: run.id, name: artifact.name};
                break;
              }
              if (!selected) {
                core.setFailed('Missing verified native build for ' + engine +
                  '; dispatch its individual CI-01 engine build.');
                return;
              }
              core.setOutput(engine + '_run', String(selected.run_id));
              core.setOutput(engine + '_name', selected.name);
            }
      - name: Download independently verified PS1 candidate
        if: (inputs.use_ci01_native_set == true || inputs.use_ci01_all_native == true) && steps.ci01_set.outputs.ps1_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_set.outputs.ps1_run }}
          name: ${{ steps.ci01_set.outputs.ps1_name }}
          path: work/connected/ci01-native/ps1
      - name: Download independently verified PSP candidate
        if: (inputs.use_ci01_native_set == true || inputs.use_ci01_all_native == true) && steps.ci01_set.outputs.psp_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_set.outputs.psp_run }}
          name: ${{ steps.ci01_set.outputs.psp_name }}
          path: work/connected/ci01-native/psp
      - name: Download independently verified DC candidate
        if: (inputs.use_ci01_native_set == true || inputs.use_ci01_all_native == true) && steps.ci01_set.outputs.dc_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_set.outputs.dc_run }}
          name: ${{ steps.ci01_set.outputs.dc_name }}
          path: work/connected/ci01-native/dc
      - name: Download independently verified GC candidate
        if: (inputs.use_ci01_native_set == true || inputs.use_ci01_all_native == true) && steps.ci01_set.outputs.gc_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_set.outputs.gc_run }}
          name: ${{ steps.ci01_set.outputs.gc_name }}
          path: work/connected/ci01-native/gc
      - name: Download independently verified PS2 candidate
        if: (inputs.use_ci01_native_set == true || inputs.use_ci01_all_native == true) && steps.ci01_set.outputs.ps2_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_set.outputs.ps2_run }}
          name: ${{ steps.ci01_set.outputs.ps2_name }}
          path: work/connected/ci01-native/ps2
      - name: Independently verify all five pinned engine receipts
        if: inputs.use_ci01_native_set == true || inputs.use_ci01_all_native == true
        shell: bash
        run: |
          set -euo pipefail
          for engine in ps1 psp dc gc ps2; do
            python3 scripts/ci/ci01_legacy_engines.py \
              --engine "$engine" --directory "work/connected/ci01-native/$engine"
          done
      - name: Discover remaining five independently verified native backends
        id: ci01_backends
        if: inputs.use_ci01_all_native == true
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const engines = ['hakux', 'xenia', 'armsx2', 'cemu', 'libretrodroid'];
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            const runs = new Map();
            for (const engine of engines) {
              const prefix = 'native-ci01-' + engine + '-';
              let chosen = null;
              const recoveryRun = '${{ inputs.recovery_native_run_id }}';
              const pcHostRun = '${{ inputs.pc_host_native_run_id }}';
              const exactRun = engine === 'libretrodroid' ? pcHostRun :
                (['cemu','xenia'].includes(engine) ? recoveryRun : '');
              if (exactRun) {
                if (exactRun !== String(context.runId)) {
                  core.setFailed('Recovery override must be the current dependency-ordered run'); return;
                }
                const exact = all.find(a => !a.expired &&
                  String(a.workflow_run?.id) === exactRun &&
                  a.name === prefix + '${{ github.sha }}');
                if (!exact) { core.setFailed('Current verified recovery component missing: ' + engine); return; }
                core.setOutput(engine + '_run', exactRun);
                core.setOutput(engine + '_name', exact.name);
                continue;
              }
              if (engine === 'xenia' && '${{ inputs.xenia_reuse_verified_xgfx01 }}' === 'true') {
                const runId = 44490853726;
                const run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId})).data;
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo, run_id: runId, per_page: 100
                });
                const exact = all.find(a => !a.expired && a.id === 14514562558 &&
                  a.workflow_run?.id === runId &&
                  a.name === 'native-ci01-xenia-2b717910b9b1aabf27fcedf21b73de82783fae20');
                if (!exact || run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo ||
                    run.head_sha !== 'cc04d8d6c300c010700287147ab6b4f106e34828' ||
                    run.event !== 'pull_request' || run.path !== '.github/workflows/cartdeck-emu-recovery.yml' ||
                    run.head_branch !== 'engineering/emu-recovery-xgfx01' ||
                    !jobs.some(j => j.name === 'instrumented-xenia / Verify and retain one genuine native component' &&
                      j.conclusion === 'success')) {
                  core.setFailed('Verified XGFX-01 native producer unavailable; do not fall back to older Xenia'); return;
                }
                core.setOutput(engine + '_run', String(runId));
                core.setOutput(engine + '_name', exact.name);
                continue;
              }
              const reuseRun = engine === 'libretrodroid' ? '${{ inputs.pc_host_reuse_run_id }}' : '';
              const reuseName = engine === 'libretrodroid' ? '${{ inputs.pc_host_reuse_artifact_name }}' : '';
              if (Boolean(reuseRun) !== Boolean(reuseName)) {
                core.setFailed('Incomplete preflight host selection'); return;
              }
              const candidates = all.filter(a => !a.expired && a.name.startsWith(prefix) &&
                  (!reuseRun || (String(a.workflow_run?.id) === reuseRun && a.name === reuseName)))
                .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
              for (const artifact of candidates) {
                const runId = artifact.workflow_run?.id;
                if (!runId) continue;
                if (!runs.has(runId)) {
                  const response = await github.rest.actions.getWorkflowRun({...context.repo, run_id: runId});
                  runs.set(runId, response.data);
                }
                const run = runs.get(runId);
                const dispatched = run.event === 'workflow_dispatch' &&
                  run.path === '.github/workflows/cartdeck-ci01-native-engine.yml' && artifact.name === prefix + run.head_sha;
                const recovered = run.event === 'pull_request' &&
                  run.path === '.github/workflows/cartdeck-emu-recovery.yml' &&
                  (run.head_branch?.startsWith('engineering/emu-recovery-') ||
                   (engine === 'xenia' && run.head_branch === 'engineering/perf-stage02-xbox-20261121')) &&
                  artifact.name.length === prefix.length + 40 &&
                  new RegExp('^' + prefix + '[0-9a-f]{40}').test(artifact.name);
                const pcHost = engine === 'libretrodroid' && run.event === 'pull_request' &&
                  run.path === '.github/workflows/cartdeck-pc-host-recovery.yml' &&
                  run.head_branch?.startsWith('engineering/perf-pc01-input-continuation-') &&
                  new RegExp('^' + prefix + '[0-9a-f]{40}$').test(artifact.name);
                if (run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo) continue;
                let trusted = run.conclusion === 'success' && (dispatched || recovered || pcHost);
                // A completed master build can retain a valid host even when its later APK job fails.
                if (!trusted && engine === 'libretrodroid' && run.status === 'completed' &&
                    run.head_branch === 'master' && run.path === '.github/workflows/cartdeck-standalone-debug.yml' &&
                    artifact.name === prefix + run.head_sha) {
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    ...context.repo, run_id: runId, per_page: 100
                  });
                  trusted = jobs.some(j => j.name.startsWith('Refresh LibretroDroid only / ') &&
                    j.name.endsWith('Verify and retain one genuine native component') && j.conclusion === 'success');
                }
                // XGFX-01 stacks on the physically accepted PERF A–E tree.
                // Reuse its exact host artifact instead of changing another engine.
                if (!trusted && engine === 'libretrodroid' && reuseRun === '44483195468' &&
                    reuseName === 'native-ci01-libretrodroid-597df350d938ea60505da935384edbdd7ed8a983' &&
                    run.conclusion === 'success' && run.event === 'pull_request' &&
                    run.head_sha === '54afc6f1efe9ddf0e6d10d0ff3e2fa35b71a25b2' &&
                    run.path === '.github/workflows/cartdeck-standalone-debug.yml' &&
                    run.head_branch === 'engineering/perf03-engine-config') {
                  trusted = true;
                }
                // A native producer is independently verified even when later APK tests fail.
                if (!trusted && engine === 'xenia' && recovered && run.status === 'completed') {
                  const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                    ...context.repo, run_id: runId, per_page: 100
                  });
                  trusted = jobs.some(j => j.name === 'instrumented-xenia / Verify and retain one genuine native component' &&
                    j.conclusion === 'success');
                }
                if (!trusted) continue;
                chosen = {run_id: run.id, name: artifact.name};
                break;
              }
              if (!chosen) {
                core.setFailed('Missing verified native artifact for ' + engine +
                  '. Build the individual CI-01 component and retain its receipt.');
                return;
              }
              core.setOutput(engine + '_run', String(chosen.run_id));
              core.setOutput(engine + '_name', chosen.name);
            }
      - name: Download verified hakux native backend
        if: inputs.use_ci01_all_native == true && steps.ci01_backends.outputs.hakux_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_backends.outputs.hakux_run }}
          name: ${{ steps.ci01_backends.outputs.hakux_name }}
          path: work/connected/ci01-native/hakux
      - name: Download verified xenia native backend
        if: inputs.use_ci01_all_native == true && steps.ci01_backends.outputs.xenia_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_backends.outputs.xenia_run }}
          name: ${{ steps.ci01_backends.outputs.xenia_name }}
          path: work/connected/ci01-native/xenia
      - name: Download verified armsx2 native backend
        if: inputs.use_ci01_all_native == true && steps.ci01_backends.outputs.armsx2_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_backends.outputs.armsx2_run }}
          name: ${{ steps.ci01_backends.outputs.armsx2_name }}
          path: work/connected/ci01-native/armsx2
      - name: Download verified cemu native backend
        if: inputs.use_ci01_all_native == true && steps.ci01_backends.outputs.cemu_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_backends.outputs.cemu_run }}
          name: ${{ steps.ci01_backends.outputs.cemu_name }}
          path: work/connected/ci01-native/cemu
      - name: Download verified libretrodroid native backend
        if: inputs.use_ci01_all_native == true && steps.ci01_backends.outputs.libretrodroid_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci01_backends.outputs.libretrodroid_run }}
          name: ${{ steps.ci01_backends.outputs.libretrodroid_name }}
          path: work/connected/ci01-native/libretrodroid
      - name: Check remaining native receipts before assembly
        if: inputs.use_ci01_all_native == true
        shell: bash
        run: |
          set -euo pipefail
          for engine in hakux xenia armsx2 cemu libretrodroid; do
            echo "Verifying native receipt: $engine"
            python3 scripts/ci/ci01_remaining_engines.py \
              --engine "$engine" --directory "work/connected/ci01-native/$engine"
            case "$engine" in
              hakux|armsx2|xenia)
                python3 scripts/ci/retain_ci01_sources.py --engine "$engine" \
                  --directory "work/connected/ci01-native/$engine" ;;
              libretrodroid)
                python3 scripts/ci/retain_ci01_host_metadata.py \
                  --directory "work/connected/ci01-native/$engine" ;;
            esac
          done
      - name: Prepare APK toolchain and pinned source resources (no emulator compilation)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk" --install 'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;34.0.0' 'cmake;3.30.3'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          bash scripts/ci/bootstrap_gradle.sh
      - uses: actions/setup-java@v4
        if: steps.inputs.outputs.reuse != 'true' && inputs.native_rebuild_authorized == true
        with:
          distribution: temurin
          java-version: '21'
      - name: Refresh expired inputs from the real pinned sources
        if: steps.inputs.outputs.reuse != 'true' && inputs.native_rebuild_authorized == true
        env:
          CARTDECK_FULL_NATIVE_REBUILD_AUTHORIZED: 'true'
        run: bash scripts/ci/build_connected_native_inputs.sh --all
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Substitute independently verified five-engine native inputs
