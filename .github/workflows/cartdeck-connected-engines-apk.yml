            "$GRADLE_BIN" ktlintCheck :lemuroid-app:testFreeBundleDebugUnitTest :lemuroid-app:assembleFreeBundleDebug \
            -Pcartdeck.dev.standaloneId=true -Pcartdeck.p0.phoneArm64Only=true \
            -Pcartdeck.p0.testVersionCode="$version_code" -Pcartdeck.p1emu.enabled=true \
            -PcartdeckNativeSystems="$(cat work/connected/bundle/native-systems.txt)" \
            -PcartdeckNativeBundleDir="$GITHUB_WORKSPACE/work/connected/bundle" \
            -PcartdeckHostMavenRepo="$GITHUB_WORKSPACE/work/connected/host/maven" \
            -PcartdeckLibretroDroidVersion=0.14.0-cartdeck3 \
            -Pkotlin.compiler.execution.strategy=in-process --no-daemon --no-configuration-cache --max-workers=2 "${benchmark_args[@]}"
          bash scripts/ci/verify_standalone_apk.sh
          python3 scripts/ci/verify_citra_apk_provenance.py \
            "$CARTDECK_OUTPUT/CARTDECK_STANDALONE_ARM64_DEBUG.apk" \
            > "$CARTDECK_OUTPUT/evidence/citra-provenance.json"
          python3 scripts/ci/verify_native_bundle_apk.py \
            "$CARTDECK_OUTPUT/CARTDECK_STANDALONE_ARM64_DEBUG.apk" work/connected/bundle \
            --require-five-engines --require-wii --require-xbox --require-xbox360 \
            --host-aar work/connected/host/maven/com/github/Swordfish90/LibretroDroid/0.14.0-cartdeck3/LibretroDroid-0.14.0-cartdeck3.aar \
            > "$CARTDECK_OUTPUT/evidence/preserved-engines.json"
          python3 scripts/ci/verify_connected_apk.py \
            --apk "$CARTDECK_OUTPUT/CARTDECK_STANDALONE_ARM64_DEBUG.apk" --bundle work/connected/bundle \
            | tee "$CARTDECK_OUTPUT/evidence/connected-engines.json"
          cp work/connected/bundle/ps2-connected-evidence.json "$CARTDECK_OUTPUT/evidence/"
          cp work/connected/cemu/native-evidence.json "$CARTDECK_OUTPUT/evidence/cemu-native-source.json"
          cp work/connected/xenia/source-manifest.json "$CARTDECK_OUTPUT/evidence/xenia-native-source.json"
          cp work/connected/bundle/assets/cartdeck/xenia-profile/profile-source.json "$CARTDECK_OUTPUT/evidence/xenia-profile-source.json"
          cp work/connected/armsx2/native-evidence.json "$CARTDECK_OUTPUT/evidence/armsx2-native-source.json"
      - name: Verify both complete PS3 engines in the connected APK
        if: inputs.include_ps3
        run: |
          python3 scripts/ps3/verify_apk.py dist/connected/CARTDECK_STANDALONE_ARM64_DEBUG.apk \
            | tee dist/connected/evidence/ps3-native-apk.json
          cp work/connected/bundle/ps3-engineering-evidence.json dist/connected/evidence/
      - name: Retain exact APK engine performance baseline
        run: |
          python3 scripts/ci/perf03_inventory.py \
            --apk dist/connected/CARTDECK_STANDALONE_ARM64_DEBUG.apk \
            --evidence dist/connected/evidence
      - name: Retain GC-01 unit results and rendered menu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ps3_owner_test && 'ps3-owner-unit-ui-evidence' || 'gc01-abc-unit-ui-evidence' }}
          path: |
            lemuroid-app/build/test-results/testFreeBundleDebugUnitTest/
            lemuroid-app/build/reports/gc01-menu-screens/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish the actual combined upgrade APK
        if: ${{ !inputs.include_ps3 || (inputs.publish_apk && inputs.distribution_licensing_cleared) }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.include_ps3 && 'CARTDECK_CONNECTED_PS2_WIIU_X360_PS3_ARM64_DEBUG' || 'CARTDECK_CONNECTED_PS2_WIIU_X360_ARM64_DEBUG' }}
          path: dist/connected/
          if-no-files-found: error
          retention-days: 30
      - name: Encrypt verified PS3 owner-test APK and evidence
        if: inputs.ps3_owner_test && inputs.include_ps3 && inputs.ps3_development_integration && !inputs.publish_apk
        env:
          OWNER_TEST_PASSPHRASE: ${{ secrets.CARTDECK_OWNER_TEST_PASSPHRASE }}
        run: |
          set -euo pipefail
          set +x
          test "${#OWNER_TEST_PASSPHRASE}" -ge 24
          test -s dist/connected/evidence/ps3-native-apk.json
          mkdir -p dist/owner-test
          archive="$GITHUB_WORKSPACE/dist/owner-test/CARTDECK_PS3_OWNER_TEST.7z"
          cd dist/connected
          7z a -t7z -mhe=on -mx=0 "-p$OWNER_TEST_PASSPHRASE" "$archive" CARTDECK_STANDALONE_ARM64_DEBUG.apk evidence >/dev/null
          7z t "-p$OWNER_TEST_PASSPHRASE" "$archive" >/dev/null
          if 7z l -pwrong-password "$archive" >/dev/null 2>&1; then
            echo '::error::Owner test archive failed encrypted header verification.'
            exit 1
          fi
          test -s "$archive"
      - name: Retain encrypted PS3 owner-test package only
        if: inputs.ps3_owner_test && inputs.include_ps3 && inputs.ps3_development_integration && !inputs.publish_apk
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_PS3_OWNER_TEST_ENCRYPTED
          path: dist/owner-test/CARTDECK_PS3_OWNER_TEST.7z
          if-no-files-found: error
          retention-days: 7
      - name: Retain exact ARMSX2 and Xenia crash symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ps3_owner_test && 'ps3-owner-connected-native-symbols' || 'connected-emulator-native-symbols' }}
          path: |
            work/connected/armsx2/verified/page-4096/libemucore_4k.so
            work/connected/armsx2/verified/page-16384/libemucore_16k.so
            work/connected/xenia/symbols/
            work/connected/cemu/cartdeck_wiiu_vulkan_host_arm64.so
            work/connected/cemu/cemu_libretro_android_arm64.so
            work/connected/cemu/native-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Keep build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.ps3_owner_test && 'ps3-owner-apk-failure' || 'connected-apk-failure' }}
          path: |
            lemuroid-app/build/reports/ktlint/
            lemuroid-app/build/test-results/
            dist/connected/evidence/apk-build-timings.json
          if-no-files-found: warn
