name: CARTDECK Room schema and migration gate

on:
  pull_request:
    paths:
      - 'retrograde-app-shared/**'
      - 'lemuroid-app/src/test/**'
      - '.github/workflows/arch-lib-01-room-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-schema:
    name: Generate and verify Room v13 schema
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare Android SDK and Gradle
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/room-sdk-licenses.log"
          "$manager" --sdk_root="$sdk_root" --install 'platforms;android-35' 'build-tools;34.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          bash scripts/ci/bootstrap_gradle.sh
      - name: Generate Room schema using actual annotation processor
        shell: bash
        run: |
          set -euo pipefail
          "$GRADLE_BIN" :retrograde-app-shared:kaptDebugKotlin --no-daemon --no-configuration-cache --max-workers=2
      - name: Emit generated v13 schema for exact commit
        if: always()
        shell: bash
        run: |
          schema=retrograde-app-shared/schemas/com.swordfish.lemuroid.lib.library.db.RetrogradeDatabase/13.json
          if [ -s "$schema" ]; then
            echo ROOM_SCHEMA_V13_BEGIN
            cat "$schema"
            echo ROOM_SCHEMA_V13_END
          else
            echo "Room 13.json not generated; gate remains blocked"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-v13-generated-schema
          path: retrograde-app-shared/schemas/com.swordfish.lemuroid.lib.library.db.RetrogradeDatabase/12.json
          if-no-files-found: warn
          retention-days: 14
