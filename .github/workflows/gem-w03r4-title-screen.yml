name: GEM W03R4 - Pinned Title Screen Wii U verification

on:
  push:
    branches:
      - data/gem-w03r4-title-screen-20261116
    paths:
      - .github/workflows/gem-w03r4-title-screen.yml
      - tools/gem/w03r4/reconcile_title_screen.py
      - tools/gem/w03r4/wiiu_master_snapshot.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    name: Verify licensed archive and reconcile research-only metadata
    if: github.repository == 'safetyblade/ROMMachine'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract Title Screen pinned archive
        run: python3 tools/gem/w03r4/reconcile_title_screen.py
      - name: Upload lightweight research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gem-w03r4-source-audit
          path: tools/gem/w03r4/generated/
          if-no-files-found: warn
      - name: Commit only research outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/gem/w03r4/generated/
          if ! git diff --cached --quiet; then
            git commit -m "data(gem): publish W03R4 verification outputs [gem-output]"
            git push
          fi
