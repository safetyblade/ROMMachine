name: P1-C1 one-shot Kotlin formatter (recheck)
on:
  push:
    branches:
      - feature/cartdeck-p1c1-appearance-v2
    paths:
      - '.github/workflows/p1-c1-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cartdeck-gradle/*.zip
          key: gradle-distribution-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap verified Gradle
        run: bash scripts/ci/bootstrap_gradle.sh
      - name: Format P1-C1 app code with repository rules
        run: |
          set -euo pipefail
          "$GRADLE_BIN" :lemuroid-app:ktlintMainSourceSetFormat :lemuroid-app:ktlintTestSourceSetFormat --no-daemon || true
          # ktlint writes auto-correctable changes before reporting remaining long lines.
          # The normal APK workflow will enforce a clean ktlintCheck after these are fixed.
      - name: Commit formatting only
        run: |
          set -euo pipefail
          git add lemuroid-app/src/main/java lemuroid-app/src/test/java
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(P1-C1): format appearance editor and persistence using repository ktlint"
          git push origin HEAD:feature/cartdeck-p1c1-appearance-v2
