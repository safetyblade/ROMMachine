name: CARTDECK WIIU-01 pinned Cemu Android ARM64 native feasibility

on:
  push:
    branches:
      - feat/wiiu-cemu-arm64-vulkan-feasibility
      - feat/wiiu-vulkan-host-frame-presenter
      - feat/wiiu-vulkan-private-apk
      - p1-emu/wiiu
    paths:
      - "scripts/ci/wiiu_cemu_contract.py"
      - "scripts/ci/test_wiiu_cemu_contract.py"
      - "scripts/ci/build_wiiu_cemu_arm64.sh"
      - "spikes/wiiu/vulkan-host/**"
      - "scripts/ci/stage_wiiu_vulkan_lab.py"
      - "lemuroid-app/src/debug/**"
      - "lemuroid-app/src/main/java/com/swordfish/lemuroid/app/shared/game/wiiu/**"
      - "scripts/ci/wiiu_notices.py"
      - "lemuroid-app/build.gradle.kts"
      - ".github/workflows/cartdeck-wiiu-cemu-arm64.yml"
  pull_request:
    paths:
      - "scripts/ci/wiiu_cemu_contract.py"
      - "scripts/ci/test_wiiu_cemu_contract.py"
      - "scripts/ci/build_wiiu_cemu_arm64.sh"
      - ".github/workflows/cartdeck-wiiu-cemu-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiiu-cemu-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Immutable pin and native ABI fail-closed unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run WIIU-01 contract tests
        run: python3 -m unittest discover -s scripts/ci -p "test_wiiu*.py" -v
      - name: Native audio behavior tests
        run: python3 -m unittest discover -s scripts/ci -p "test_wiiu_audio.py" -v

      - name: Preserve baseline payload bytes and reject collisions
        run: python3 -m unittest discover -s scripts/ci -p 'test_merge_verified_native_payloads.py' -v

  android-arm64-core:
    name: Source-build real Android Cemu core and prove ABI (not game proof)
    # Dedicated Wii U branch only; require actual native build even for its PR.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      CARTDECK_WIIU_BUILD_VULKAN_HOST: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Android native cross-compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build nasm autoconf automake libtool pkg-config python3
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk" --install 'ndk;29.0.14206865' 'platforms;android-35' 'cmake;3.30.3'
          test -x "$sdk/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          df -h .
      - name: Build pinned upstream Android arm64-v8a (fail red on errors)
        shell: bash
        run: bash scripts/ci/build_wiiu_cemu_arm64.sh "$RUNNER_TEMP/wiiu-cemu-arm64"
      - name: Assert no APK/gameplay false claim
        shell: bash
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/wiiu-cemu-arm64/native-evidence.json"
          test -s "$RUNNER_TEMP/wiiu-cemu-arm64/cartdeck_wiiu_vulkan_host_arm64.so"
          python3 - "$RUNNER_TEMP/wiiu-cemu-arm64/native-evidence.json" <<'PY'
          import json, sys
          a = json.load(open(sys.argv[1], encoding="utf-8"))
          assert a["native_abi_pass"]
          assert not a["vulkan_frontend_verified"]
          assert not a["apk_packaged"]
          assert not a["device_gameplay_verified"]
          print("Cemu compiled ABI only; host integration and owner QA remain mandatory")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wiiu-cemu-verified-arm64-core-private-not-an-apk
          path: |
            ${{ runner.temp }}/wiiu-cemu-arm64/cemu-licenses.zip
            ${{ runner.temp }}/wiiu-cemu-arm64/native-evidence.json
            ${{ runner.temp }}/wiiu-cemu-arm64/cemu_libretro_android_arm64.so
            ${{ runner.temp }}/wiiu-cemu-arm64/cartdeck_wiiu_vulkan_host_arm64.so
            ${{ runner.temp }}/wiiu-cemu-arm64/vulkan-host-elf.txt
          if-no-files-found: error
          retention-days: 7

  legacy-engines:
    name: Android ARM64 engine — ${{ matrix.engine }}
    needs: [contract-tests]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        engine: [ps1, psp, dc, gc, ps2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native toolchain
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/native-sdk-licenses.log"
          "$manager" --sdk_root="$sdk_root" --install 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/native-tools"
          "$RUNNER_TEMP/native-tools/bin/pip" install 'cmake==3.31.6' 'ninja==1.11.1.4'
          echo "$RUNNER_TEMP/native-tools/bin" >> "$GITHUB_PATH"
      - name: Build pinned engine, assets and provenance
        env:
          ENGINE: ${{ matrix.engine }}
          NATIVE_BUILD_JOBS: '2'
          NATIVE_JOBS: '2'
        run: |
          set -euo pipefail
          case "$ENGINE" in
            ps1) builder=build_ps1_upstream_core.sh ;;
            psp) builder=build_psp_upstream_core.sh ;;
            dc) builder=build_dreamcast_upstream_core.sh ;;
            gc) builder=build_gamecube_upstream_core.sh ;;
            ps2) builder=build_ps2_upstream_core.sh ;;
            *) exit 1 ;;
          esac
          bash "scripts/ci/$builder" "work/native-packages/$ENGINE"
      - name: Retain verified build input for the APK job
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-${{ matrix.engine }}
          path: work/native-packages/${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 1

      - name: Retain exact Play native symbols for handset traces
        if: matrix.engine == 'ps2'
        uses: actions/upload-artifact@v4
        with:
          name: ps2-native-symbols
          path: work/native-packages/ps2/symbols/
          if-no-files-found: error
          retention-days: 14

  wiiu-private-test-apk:
    name: Source-verified Cemu + Vulkan host private APK (NOT gameplay)
    needs: [contract-tests, android-arm64-core, legacy-engines]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: wiiu-cemu-verified-arm64-core-private-not-an-apk
          path: ${{ runner.temp }}/wiiu-native
      - name: Download the independently source-built baseline engines
        uses: actions/download-artifact@v4
        with:
          pattern: native-engine-*
          path: ${{ runner.temp }}/legacy-engines
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare SDK, pinned GLES host and full Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk" --install 'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;34.0.0' 'cmake;3.22.1'
          bash scripts/ci/bootstrap_gradle.sh
          export HOST_BUILD_DIR="$RUNNER_TEMP/wiiu-existing-frontend"
          export HOST_MAVEN_REPO="$RUNNER_TEMP/wiiu-existing-host-maven"
          export LIBRETRODROID_SOURCE_DIR="$HOST_BUILD_DIR/source"
          export BUILD_JOBS=2
          bash scripts/ci/build_libretrodroid_host.sh
          echo "WIIU_HOST_MAVEN=$HOST_MAVEN_REPO" >> "$GITHUB_ENV"
      - name: Stage only SHA-verified real Cemu and Vulkan host binaries
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/stage_wiiu_vulkan_lab.py \
            --work "$RUNNER_TEMP/wiiu-native" \
            --output "$RUNNER_TEMP/wiiu-private-payload" \
            --readelf "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Retain verified baseline engines in the private cartridge APK
        shell: bash
        run: |
          set -euo pipefail
          FALLBACK="$RUNNER_TEMP/cartdeck-legacy-bundle"
          python3 scripts/ci/stage_native_bundle.py --output "$FALLBACK" \
            --readelf "$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            --ps1 "$RUNNER_TEMP/legacy-engines/native-engine-ps1" \
            --psp "$RUNNER_TEMP/legacy-engines/native-engine-psp" \
            --dc "$RUNNER_TEMP/legacy-engines/native-engine-dc" \
            --gc "$RUNNER_TEMP/legacy-engines/native-engine-gc" \
            --ps2 "$RUNNER_TEMP/legacy-engines/native-engine-ps2" --wii
          python3 scripts/ci/merge_verified_native_payloads.py --source "$FALLBACK" --destination "$RUNNER_TEMP/wiiu-private-payload"
      - name: Full Kotlin lint, JVM tests and isolated Wii U debug APK
        shell: bash
        run: |
          set -euo pipefail
          "$GRADLE_BIN" ktlintCheck :lemuroid-app:testFreeBundleDebugUnitTest :lemuroid-app:assembleFreeBundleDebug \
            -Pcartdeck.wiiu.labId=true \
            -Pcartdeck.p0.phoneArm64Only=true \
            -Pcartdeck.p0.testVersionCode=90611402 \
            -PcartdeckNativeSystems="$(cat "$RUNNER_TEMP/cartdeck-legacy-bundle/native-systems.txt")" \
            -PcartdeckNativeBundleDir="$RUNNER_TEMP/wiiu-private-payload" \
            -PcartdeckHostMavenRepo="$WIIU_HOST_MAVEN" \
            -PcartdeckLibretroDroidVersion=0.14.0-cartdeck3 \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon --no-configuration-cache --max-workers=2
      - name: Runtime storage, pad, viewport and complete-pair rollback contracts
        run: '"$GRADLE_BIN" -p scripts/ci/wiiu-tests test --no-daemon --max-workers=2'
      - name: Verify signed private Android package and unmodified JNI libraries
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find lemuroid-app/build/outputs/apk/freeBundle/debug -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          APK="${apks[0]}"
          mkdir -p dist/wiiu-private
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" > dist/wiiu-private/package.txt
          grep -F "package: name='dev.prestwich.cartdeck.wiiulab.debug'" dist/wiiu-private/package.txt
          grep -F "versionCode='90611402'" dist/wiiu-private/package.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > dist/wiiu-private/signing.txt
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 "$APK"
          python3 - "$APK" "$RUNNER_TEMP/wiiu-private-payload/wiiu-bundle-evidence.json" <<'PY'
          import hashlib, json, sys, zipfile
          apk, proof = sys.argv[1:]
          p = json.load(open(proof, encoding='utf-8'))
          assert p['result'] == 'WIIU_SOURCE_VERIFIED_PRIVATE_JNI_BUNDLE_ONLY'
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              assert not any(name.startswith('lib/') and not name.startswith('lib/arm64-v8a/') for name in names)
              for name, meta in p['libraries'].items():
                  member = 'lib/arm64-v8a/' + name
                  assert member in names, 'Missing verified native ELF: ' + member
                  assert hashlib.sha256(z.read(member)).hexdigest() == meta['sha256']
          print('Private Wii U lab APK contains exact source-verified core and host; gameplay UNVERIFIED')
          PY
          python3 scripts/ci/verify_native_bundle_apk.py "$APK" "$RUNNER_TEMP/cartdeck-legacy-bundle" \
            --require-five-engines --require-wii \
            --host-aar "$WIIU_HOST_MAVEN/com/github/Swordfish90/LibretroDroid/0.14.0-cartdeck3/LibretroDroid-0.14.0-cartdeck3.aar"
          cp "$APK" dist/wiiu-private/CARTDECK_WIIU_VULKAN_ARM64_PRIVATE_TEST.apk
          sha256sum dist/wiiu-private/*.apk | tee dist/wiiu-private/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_WIIU_VULKAN_ARM64_PRIVATE_TEST_APK
          path: dist/wiiu-private/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wiiu-private-apk-failure-evidence
          path: |
            lemuroid-app/build/reports/ktlint/
            lemuroid-app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
