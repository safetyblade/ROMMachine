name: P0-A Android debug APK

# This is a build-and-test workflow only. Never tag, sign a release or publish a Release.
on:
  push:
    branches:
      - 'p0-a/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartdeck-p0-a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build existing freeBundleDebug variant
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout exact source and recursive native submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # setup-android@v3 tried to install obsolete 'tools' (run 42455131571).
      # Removing it left sdkmanager off PATH (run 42455273266).
      # Use the exact preinstalled cmdline-tools location established by first run.
      - name: Configure hosted SDK path and install declared packages
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          printf 'ANDROID_HOME=%s\n' "$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$manager" --version
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes)
          "$manager" --sdk_root="$sdk_root" --install "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Configure Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Record source and toolchain before building
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          git rev-parse HEAD | tee build-evidence/commit-sha.txt
          git submodule status --recursive | tee build-evidence/submodule-shas.txt
          git status --porcelain=v1 | tee build-evidence/checkout-status.txt
          java -version 2>&1 | tee build-evidence/java-version.txt
          chmod +x gradlew
          ./gradlew --version | tee build-evidence/gradle-version.txt
          sdkmanager --list_installed | tee build-evidence/sdk-packages.txt
          {
            echo 'Expected SDK: compile/target 35, build tools 34.0.0; Kotlin 2.0.21; AGP 8.4.0.'
            echo 'No NDK version is pinned by the inspected root config.'
            echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          } | tee build-evidence/config-summary.txt

      - name: Assemble the unchanged freeBundleDebug variant
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :lemuroid-app:assembleFreeBundleDebug --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee build-evidence/gradle-build.log

      - name: Verify debug APK and capture signed-binary evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          mapfile -t apks < <(find lemuroid-app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -ne 1 ]; then
            printf 'Expected exactly one APK for freeBundleDebug; got %s\n' "${#apks[@]}" >&2
            printf '%s\n' "${apks[@]}" >&2
            exit 1
          fi
          src="${apks[0]}"
          case "$src" in
            *freeBundle/debug/*) ;;
            *) echo "Unexpected variant output path: $src" >&2; exit 1 ;;
          esac
          cp "$src" artifacts/cartdeck-p0-a-freeBundle-debug.apk
          sha256sum artifacts/cartdeck-p0-a-freeBundle-debug.apk | tee build-evidence/apk-sha256.txt
          du -b artifacts/cartdeck-p0-a-freeBundle-debug.apk | tee build-evidence/apk-size.txt
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs artifacts/cartdeck-p0-a-freeBundle-debug.apk | tee build-evidence/apk-signing.txt
          "${ANDROID_HOME}/build-tools/34.0.0/aapt" dump badging artifacts/cartdeck-p0-a-freeBundle-debug.apk > build-evidence/apk-badging.txt
          grep -E '^package:|^sdkVersion:|^targetSdkVersion:' build-evidence/apk-badging.txt
          python3 scripts/p0_apk_inventory.py artifacts/cartdeck-p0-a-freeBundle-debug.apk build-evidence
          # ZIP alignment verification is reported independently of ELF PT_LOAD alignment.
          if "${ANDROID_HOME}/build-tools/34.0.0/zipalign" -c -P 16 -v 4 artifacts/cartdeck-p0-a-freeBundle-debug.apk > build-evidence/zipalign-16kb.txt 2>&1; then
            echo "ZIPALIGN_P16_PASS" >> build-evidence/zipalign-16kb.txt
          else
            echo "ZIPALIGN_P16_FAILED_OR_UNSUPPORTED: review log and ABI/legacy-packaging behaviour" >> build-evidence/zipalign-16kb.txt
          fi
          cat build-evidence/16kb-elf-summary.txt
          tail -n 4 build-evidence/zipalign-16kb.txt

      - name: Upload installable DEBUG APK (no release signing)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartdeck-p0-a-freeBundle-debug-${{ github.run_id }}
          path: artifacts/cartdeck-p0-a-freeBundle-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build evidence, including failure log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartdeck-p0-a-build-evidence-${{ github.run_id }}
          path: build-evidence/
          if-no-files-found: warn
          retention-days: 14

  phone-arm64:
    name: Phone APK / ARM64 / stable upgrade signing
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure hosted Android SDK
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          echo "ANDROID_HOME=$root" >> "$GITHUB_ENV"
          printf '%s\n' "$root/cmdline-tools/latest/bin" "$root/platform-tools" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$root" --licenses < <(yes)
          "$manager" --sdk_root="$root" --install "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Configure Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Build phone-only debug APK with increasing version
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p phone-evidence phone-artifacts
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          echo "P0_TEST_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "$version_code" > phone-evidence/version-code.txt
          git rev-parse HEAD | tee phone-evidence/commit-sha.txt
          git submodule status --recursive | tee phone-evidence/submodule-shas.txt
          ./gradlew :lemuroid-app:assembleFreeBundleDebug \
            -Pcartdeck.p0.phoneArm64Only=true \
            -Pcartdeck.p0.testVersionCode="$version_code" \
            --no-daemon --no-configuration-cache --stacktrace \
            2>&1 | tee phone-evidence/gradle-phone-build.log

      - name: Verify signing identity and phone APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find lemuroid-app/build/outputs/apk/freeBundle/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" phone-artifacts/CARTDECK_LATEST_ARM64_DEBUG.apk
          apk="phone-artifacts/CARTDECK_LATEST_ARM64_DEBUG.apk"
          sha256sum "$apk" | tee phone-evidence/apk-sha256.txt
          du -b "$apk" | tee phone-evidence/apk-size.txt
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs --verbose "$apk" | tee phone-evidence/apk-signing.txt
          expected="ce3ebf1d972c09583470e184d9b86edd20eb4679fedc632d31ac9f58e8741fc8"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' phone-evidence/apk-signing.txt | head -n 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected signing certificate. Stop: cannot upgrade existing test install safely." >&2
            exit 1
          fi
          "${ANDROID_HOME}/build-tools/34.0.0/aapt" dump badging "$apk" > phone-evidence/apk-badging.txt
          grep -E '^package:|^native-code:' phone-evidence/apk-badging.txt
          grep -q "versionCode='$P0_TEST_VERSION_CODE'" phone-evidence/apk-badging.txt
          grep -q "name='com.swordfish.lemuroid.debug'" phone-evidence/apk-badging.txt
          python3 scripts/p0_apk_inventory.py "$apk" phone-evidence
          if grep -qE 'lib/(x86|x86_64|armeabi-v7a)/' phone-evidence/native-libraries.tsv; then
            echo "::error::Unexpected non-ARM64 libraries in phone APK" >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          size = os.path.getsize("phone-artifacts/CARTDECK_LATEST_ARM64_DEBUG.apk")
          assert size < 100 * 1024 * 1024, f"Phone APK exceeds 100 MiB Drive path limit: {size}"
          PY

      - name: Upload compact signed debug APK for phone
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cartdeck-phone-arm64-${{ github.run_id }}
          path: phone-artifacts/CARTDECK_LATEST_ARM64_DEBUG.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload phone-build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartdeck-phone-evidence-${{ github.run_id }}
          path: phone-evidence/
          if-no-files-found: warn
          retention-days: 30

  emulator-launch:
    name: Android emulator install / initial launch (no ROM assertions)
    needs: build-debug
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Download the exact debug APK from build job
        uses: actions/download-artifact@v4
        with:
          name: cartdeck-p0-a-freeBundle-debug-${{ github.run_id }}
          path: artifacts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Boot emulator and smoke-test APK installation/launch
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            # android-emulator-runner executes this script with /bin/sh, not bash.
            set -eu
            mkdir -p emulator-evidence
            trap 'adb logcat -d > emulator-evidence/logcat.txt 2>&1 || true' EXIT
            adb install -r artifacts/cartdeck-p0-a-freeBundle-debug.apk | tee emulator-evidence/install.txt
            adb shell am start -W -n com.swordfish.lemuroid.debug/com.swordfish.lemuroid.app.mobile.feature.main.MainActivity | tee emulator-evidence/launch.txt
            sleep 10
            adb shell pidof com.swordfish.lemuroid.debug | tee emulator-evidence/running-pid.txt
            adb shell getprop ro.build.version.sdk | tee emulator-evidence/android-api.txt

      - name: Upload emulator smoke logs (not game/ROM QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartdeck-p0-a-emulator-evidence-${{ github.run_id }}
          path: emulator-evidence/
          if-no-files-found: warn
          retention-days: 14
