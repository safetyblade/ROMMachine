name: CARTDECK PS2-01 Play Android ARM64 executable core build (not shipped)

on:
  pull_request:
    paths:
      - ".github/workflows/cartdeck-ps2-01-android.yml"
      - "spikes/nextgen/**"
      - "lemuroid-app/src/debug/**"
      - "scripts/ci/ps2*"
      - "scripts/ci/build_ps2_upstream_core.sh"
      - "scripts/ci/patches/play-android-private-storage-gles.patch"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps2-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s spikes/nextgen -p 'test_*.py' -v
      - run: python3 -m unittest discover -s scripts/ci -p 'test_ps201_device_probe.py' -v

  play-libretro-android-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      PLAY_SOURCE_SHA: 1f27232772e484bfb79364b751b84f41f4c87481
      NDK_REV: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_REV"
          test -f "$ANDROID_HOME/ndk/$NDK_REV/build/cmake/android.toolchain.cmake"
      - name: Build and verify the same core used for local private testing
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_REV"
          bash scripts/ci/build_ps2_upstream_core.sh "$RUNNER_TEMP/ps2-output"
          {
            cat "$RUNNER_TEMP/ps2-output/provenance.txt"
            cat "$RUNNER_TEMP/ps2-output/sha256.txt"
            echo "No binary uploaded. Android graphics/audio/gameplay remain unverified."
          } >> "$GITHUB_STEP_SUMMARY"
