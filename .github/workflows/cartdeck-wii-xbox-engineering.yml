name: CARTDECK Wii and Xbox engineering APKs

# Shared native pipeline: existing five engines, Wii and the independent Xbox backend.
# Authenticated Actions QA artifacts only; no GitHub Release publishing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartdeck-wii-xbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-preflight:
    name: Source preflight — branch freshness, Kotlin lint and CI contracts
    # This is the fast fail gate for both the reusable pipeline and manual runs.
    # Do NOT spend runner minutes on native engines/host/Xbox if source lint fails.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Reject stale pull-request branches before costly builds
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/${PR_BASE_REF}:refs/remotes/origin/cartdeck-ci-base"
          if ! git merge-base --is-ancestor refs/remotes/origin/cartdeck-ci-base "$PR_HEAD_SHA"; then
            echo "::error::This PR branch is missing commits from its current base. Rebase/merge the latest master into the branch and rerun CI."
            echo "### Stale pull-request branch" >> "$GITHUB_STEP_SUMMARY"
            echo "Integrate the latest base branch (${PR_BASE_REF}) into the PR branch before validation or merge." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fast source and pipeline contract tests (no APK)
        run: |
          set -euo pipefail
          python3 scripts/audit_cartdeck_brand.py
          python3 -m unittest discover -s scripts/ci -p 'test_ci_kotlin_gate.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_game_menu_contract.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_hakux_pixel_probe.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_hakux_guest_publication.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_hakux_guest_submission.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_native_symbols.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_native_bundle_apk.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_stage_native_bundle.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_hakux_native.py' -v
          bash scripts/ci/test_android_emulator_smoke.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cartdeck-gradle/*.zip
          key: gradle-distribution-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure minimal Android SDK and pinned Gradle
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/preflight-sdk-licenses.log"
          "$manager" --sdk_root="$sdk_root" --install 'platforms;android-35' 'build-tools;34.0.0'
          bash scripts/ci/bootstrap_gradle.sh
      - name: Kotlin lint for production and test sources (same gate as APK)
        run: |
          set -euo pipefail
          "$GRADLE_BIN" ktlintCheck \
            --no-daemon --no-configuration-cache --max-workers=2
      - name: Print actionable Kotlin lint diagnostics
        if: failure()
        run: |
          for report in lemuroid-app/build/reports/ktlint/*/*.txt \
                        lemuroid-touchinput/build/reports/ktlint/*/*.txt \
                        retrograde-app-shared/build/reports/ktlint/*/*.txt; do
            if [ -s "$report" ]; then
              echo "::group::$report"
              head -n 120 "$report"
              echo "::endgroup::"
            fi
          done

  kotlin-verify:
    name: Android compilation and JVM tests — mandatory pre-native gate
    # The patched host is the exact AAR used by the APK. JVM tests and
    # both production/test source compilations must pass before engine builds.
    # Do not replace this gate with ktlint or a reduced variant.
    needs: [source-preflight, native-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact validated source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Download the pinned Android host compiled for this commit
        uses: actions/download-artifact@v4
        with:
          name: patched-libretrodroid-host
          path: work/host-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore pinned Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cartdeck-gradle/*.zip
          key: gradle-distribution-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Android SDK and pinned Gradle
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/kotlin-gate-sdk-licenses.log"
          "$manager" --sdk_root="$sdk_root" --install 'platforms;android-35' 'build-tools;34.0.0'
          bash scripts/ci/bootstrap_gradle.sh
      - name: Compile production and test Kotlin, then run JVM tests
        run: |
          set -euo pipefail
          version_code=$(bash scripts/ci/engineering_version_code.sh)
          test "$version_code" -gt 252
          # Match the final APK's FreeBundleDebug variant, patched host and
          # full set of optional console compile flags. Native binaries are
          # not necessary for Kotlin compilation or Robolectric unit tests.
          "$GRADLE_BIN" \
            :lemuroid-app:compileFreeBundleDebugKotlin \
            :lemuroid-app:compileFreeBundleDebugUnitTestKotlin \
            :lemuroid-app:testFreeBundleDebugUnitTest \
            -Pcartdeck.dev.standaloneId=true \
            -Pcartdeck.p0.phoneArm64Only=true \
            -Pcartdeck.p0.testVersionCode="$version_code" \
            -PcartdeckHostMavenRepo="$GITHUB_WORKSPACE/work/host-input/maven" \
            -PcartdeckLibretroDroidVersion=0.14.0-cartdeck3 \
            -PcartdeckNativeSystems=dc,gc,ps2,wii,xbox,xbox360 \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon --no-configuration-cache --max-workers=2 \
            2>&1 | tee "$RUNNER_TEMP/cartdeck-kotlin-gate.log"
      - name: Summarise the first actionable Kotlin or JVM failure
        if: failure()
        run: |
          {
            echo '### CARTDECK Android compile / JVM test gate FAILED'
            echo 'Native emulator builds were blocked because shared application verification did not pass.'
            echo 'Look at the first compiler error or failed test, rather than rerunning unchanged APK workflows.'
            echo '```text'
            if [ -s "$RUNNER_TEMP/cartdeck-kotlin-gate.log" ]; then
              grep -E 'e: file:|error:|FAILED|FAILURE: Build failed|tests completed' \
                "$RUNNER_TEMP/cartdeck-kotlin-gate.log" | head -n 35 || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain failed compiler and JVM test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cartdeck-kotlin-gate-failure
          path: |
            ${{ runner.temp }}/cartdeck-kotlin-gate.log
            lemuroid-app/build/test-results/testFreeBundleDebugUnitTest/
            lemuroid-app/build/reports/tests/testFreeBundleDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  native-engines:
    name: Android ARM64 engine — ${{ matrix.engine }}
    needs: [kotlin-verify]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        engine: [ps1, psp, dc, gc, ps2]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned native toolchain
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/native-sdk-licenses.log"
          "$manager" --sdk_root="$sdk_root" --install 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/native-tools"
          "$RUNNER_TEMP/native-tools/bin/pip" install 'cmake==3.31.6' 'ninja==1.11.1.4'
          echo "$RUNNER_TEMP/native-tools/bin" >> "$GITHUB_PATH"
      - name: Build pinned engine, assets and provenance
        env:
          ENGINE: ${{ matrix.engine }}
          NATIVE_BUILD_JOBS: '2'
          NATIVE_JOBS: '2'
        run: |
          set -euo pipefail
          case "$ENGINE" in
            ps1) builder=build_ps1_upstream_core.sh ;;
            psp) builder=build_psp_upstream_core.sh ;;
            dc) builder=build_dreamcast_upstream_core.sh ;;
            gc) builder=build_gamecube_upstream_core.sh ;;
            ps2) builder=build_ps2_upstream_core.sh ;;
            *) exit 1 ;;
          esac
          bash "scripts/ci/$builder" "work/native-packages/$ENGINE"
      - name: Retain verified build input for the APK job
        uses: actions/upload-artifact@v4
        with:
          name: native-engine-${{ matrix.engine }}
          path: work/native-packages/${{ matrix.engine }}/
          if-no-files-found: error
          retention-days: 1

      - name: Retain exact Play native symbols for handset traces
        if: matrix.engine == 'ps2'
        uses: actions/upload-artifact@v4
        with:
          name: ps2-native-symbols
          path: work/native-packages/ps2/symbols/
          if-no-files-found: error
          retention-days: 14

  native-host:
    name: Patched Android graphics and input host
    needs: [source-preflight]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android host toolchain
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/host-sdk-licenses.log"
          "$manager" --sdk_root="$sdk_root" --install 'ndk;29.0.14206865' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;34.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"
      - name: Build and test the exact patched LibretroDroid host
        run: |
          set -euo pipefail
          export HOST_BUILD_DIR="$RUNNER_TEMP/cartdeck-host"
          export HOST_MAVEN_REPO="$GITHUB_WORKSPACE/work/host-package/maven"
          export LIBRETRODROID_SOURCE_DIR="$HOST_BUILD_DIR/source"
          export BUILD_JOBS=2
          bash scripts/ci/build_libretrodroid_host.sh
          bash scripts/ci/test_libretrodroid_input.sh
          cp "$HOST_BUILD_DIR/provenance.txt" work/host-package/provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: patched-libretrodroid-host
          path: work/host-package/
          if-no-files-found: error
          retention-days: 1

      - name: Retain exact Android host symbols for handset traces
        uses: actions/upload-artifact@v4
        with:
          name: libretrodroid-native-symbols
          path: ${{ runner.temp }}/cartdeck-host/symbols/
          if-no-files-found: error
          retention-days: 14

  native-xbox:
    name: Android ARM64 hakuX SDL3 backend
    needs: [kotlin-verify]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Android toolchain
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > "$RUNNER_TEMP/xbox-sdk-licenses.log"
          "$manager" --sdk_root="$sdk_root" --install 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/29.0.14206865" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/xbox-tools"
          "$RUNNER_TEMP/xbox-tools/bin/pip" install 'cmake==3.31.6' 'ninja==1.11.1.4'
          echo "$RUNNER_TEMP/xbox-tools/bin" >> "$GITHUB_PATH"
      - name: Build pinned hakuX and required dependencies
        env:
          NATIVE_BUILD_JOBS: '2'
        run: bash scripts/ci/build_hakux_native.sh work/native-packages/xbox
      - uses: actions/upload-artifact@v4
        with:
          name: hakux-android-backend
          path: work/native-packages/xbox/
          if-no-files-found: error
          retention-days: 30

  apk-wii:
    name: Build and verify Wii APK independently
    needs: [source-preflight, kotlin-verify, native-engines, native-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARTDECK_OUTPUT: dist/cartdeck
      CARTDECK_REQUIRE_FIVE_ENGINES: 'true'
      CARTDECK_REQUIRE_WII: 'true'
      CARTDECK_APK_MAX_MIB: '256'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and pinned cores
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download all five verified engine packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-engine-*
          path: work/native-inputs
      - name: Download the patched Android host
        uses: actions/download-artifact@v4
        with:
          name: patched-libretrodroid-host
          path: work/host-input

      - name: Create evidence directory
        run: mkdir -p dist/cartdeck/evidence

      - name: Check that incomplete or baseline APKs cannot be published
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_verify_native_bundle_apk.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_stage_native_bundle.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_hakux_native.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > dist/cartdeck/evidence/sdk-licenses.log
          "$manager" --sdk_root="$sdk_root" --install 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0'

      - name: Restore verified Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cartdeck-gradle/*.zip
          key: gradle-distribution-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Download and verify pinned Gradle with bounded retries
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_gradle.sh 2>&1 | tee dist/cartdeck/evidence/gradle-bootstrap.log

      - name: Validate brand, source assets and native resource contracts
        run: |
          set -euo pipefail
          {
            python3 scripts/ci/test_bootstrap_gradle.py
            python3 scripts/ci/test_build_retry.py
            python3 scripts/audit_cartdeck_brand.py
            python3 -m unittest discover design/cartdeck-v03 -p 'test_dpad_consistency.py'
            python3 -m unittest discover design/cartdeck-v04 -p 'test_assets.py'
            python3 -m unittest discover design/cartdeck-v05 -p 'test_cartridge_family.py'
            python3 -m unittest discover design/cartdeck-v06 -p 'test_bookshelf_palette.py'
            python3 design/cartdeck-v04/build_assets.py
            python3 design/cartdeck-v04/export_android_vectors.py
            python3 -m unittest discover design/cartdeck-v04 -p 'test_android_export.py'
            python3 scripts/test_cartridge_vectors.py
            python3 scripts/generate_cartdeck_native_assets.py --output lemuroid-app/build/generated/cartdeck-native/res
            python3 -m unittest discover scripts/ci -p 'test_cartdeck_native_assets.py' -v
            bash scripts/ci/check_cartdeck_native_aapt2.sh
            bash scripts/ci/test_android_emulator_smoke.sh
            git diff --exit-code -- design/cartdeck-v03 design/cartdeck-v04 design/cartdeck-v05
          } 2>&1 | tee dist/cartdeck/evidence/asset-checks.log

      - name: Run style and unit tests and build the single standalone APK
        run: |
          set -euo pipefail
          version_code=$(bash scripts/ci/engineering_version_code.sh)
          test "$version_code" -gt 2001
          echo "CARTDECK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "$version_code" > dist/cartdeck/evidence/version-code.txt
          git rev-parse HEAD > dist/cartdeck/evidence/commit-sha.txt
          git submodule status --recursive > dist/cartdeck/evidence/submodule-shas.txt
          export CARTDECK_TEST_VERSION_CODE="$version_code"
          export CARTDECK_HOST_MAVEN_REPO="$GITHUB_WORKSPACE/work/host-input/maven"
          bash scripts/ci/build_native_engine_apk.sh \
            --ps1 work/native-inputs/native-engine-ps1 \
            --psp work/native-inputs/native-engine-psp \
            --dc work/native-inputs/native-engine-dc \
            --gc work/native-inputs/native-engine-gc \
            --ps2 work/native-inputs/native-engine-ps2 \
            --wii
          cp work/host-input/provenance.txt dist/cartdeck/evidence/host-provenance.txt

      - name: Print actionable Kotlin lint diagnostics on failure
        if: failure()
        run: |
          for report in lemuroid-app/build/reports/ktlint/*/*.txt retrograde-app-shared/build/reports/ktlint/*/*.txt; do
            if [ -s "$report" ]; then
              echo "::group::$report"
              head -n 120 "$report"
              echo "::endgroup::"
            fi
          done

      - name: Verify the APK and its upgrade identity
        run: |
          set -euo pipefail
          bash scripts/ci/verify_standalone_apk.sh
          python3 scripts/ci/verify_native_bundle_apk.py \
            dist/cartdeck/CARTDECK_STANDALONE_ARM64_DEBUG.apk dist/cartdeck/bundle \
            --require-five-engines --require-wii \
            --host-aar work/host-input/maven/com/github/Swordfish90/LibretroDroid/0.14.0-cartdeck3/LibretroDroid-0.14.0-cartdeck3.aar \
            > dist/cartdeck/evidence/native-bundle-apk.json
          cat dist/cartdeck/evidence/native-bundle-apk.json

      - name: Collect test and native asset evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist/cartdeck/evidence
          for source in \
            lemuroid-app/build/test-results/testFreeBundleDebugUnitTest \
            lemuroid-app/build/reports/tests/testFreeBundleDebugUnitTest \
            lemuroid-app/build/reports/cartridge-setup \
            lemuroid-app/build/generated/cartdeck-native/native-assets-manifest.json \
            lemuroid-app/build/generated/cartdeck-native/aapt2-evidence; do
            if [ -e "$source" ]; then
              cp -R "$source" "dist/cartdeck/evidence/$(basename "$(dirname "$source")")-$(basename "$source")"
            fi
          done
          while IFS= read -r manifest; do
            variant="$(basename "$(dirname "$manifest")")"
            cp "$manifest" "dist/cartdeck/evidence/native-assets-$variant.json"
          done < <(find lemuroid-app/build/generated -name native-assets-manifest.json -type f 2>/dev/null)

      - name: Upload the verified expansion APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_WII_ARM64_DEBUG
          path: |
            dist/cartdeck/CARTDECK_STANDALONE_ARM64_DEBUG.apk
            dist/cartdeck/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failure diagnostics without publishing an unverified APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_WII_FAILURE_EVIDENCE
          path: dist/cartdeck/evidence/
          if-no-files-found: warn
          retention-days: 7

  apk-combined:
    name: Build and verify Wii plus Xbox APK
    needs: [source-preflight, kotlin-verify, native-engines, native-host, native-xbox]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARTDECK_OUTPUT: dist/cartdeck
      CARTDECK_REQUIRE_FIVE_ENGINES: 'true'
      CARTDECK_REQUIRE_WII: 'true'
      CARTDECK_REQUIRE_XBOX: 'true'
      CARTDECK_APK_MAX_MIB: '256'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and pinned cores
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download all five verified engine packages
        uses: actions/download-artifact@v4
        with:
          pattern: native-engine-*
          path: work/native-inputs
      - name: Download the patched Android host
        uses: actions/download-artifact@v4
        with:
          name: patched-libretrodroid-host
          path: work/host-input

      - name: Download verified hakuX backend
        uses: actions/download-artifact@v4
        with:
          name: hakux-android-backend
          path: work/xbox-input

      - name: Create evidence directory
        run: mkdir -p dist/cartdeck/evidence

      - name: Check that incomplete or baseline APKs cannot be published
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_verify_native_bundle_apk.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_stage_native_bundle.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_hakux_native.py' -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/cmdline-tools/latest/bin" "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > dist/cartdeck/evidence/sdk-licenses.log
          "$manager" --sdk_root="$sdk_root" --install 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0'

      - name: Restore verified Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cartdeck-gradle/*.zip
          key: gradle-distribution-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Download and verify pinned Gradle with bounded retries
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_gradle.sh 2>&1 | tee dist/cartdeck/evidence/gradle-bootstrap.log

      - name: Validate brand, source assets and native resource contracts
        run: |
          set -euo pipefail
          {
            python3 scripts/ci/test_bootstrap_gradle.py
            python3 scripts/ci/test_build_retry.py
            python3 scripts/audit_cartdeck_brand.py
            python3 -m unittest discover design/cartdeck-v03 -p 'test_dpad_consistency.py'
            python3 -m unittest discover design/cartdeck-v04 -p 'test_assets.py'
            python3 -m unittest discover design/cartdeck-v05 -p 'test_cartridge_family.py'
            python3 -m unittest discover design/cartdeck-v06 -p 'test_bookshelf_palette.py'
            python3 design/cartdeck-v04/build_assets.py
            python3 design/cartdeck-v04/export_android_vectors.py
            python3 -m unittest discover design/cartdeck-v04 -p 'test_android_export.py'
            python3 scripts/test_cartridge_vectors.py
            python3 scripts/generate_cartdeck_native_assets.py --output lemuroid-app/build/generated/cartdeck-native/res
            python3 -m unittest discover scripts/ci -p 'test_cartdeck_native_assets.py' -v
            bash scripts/ci/check_cartdeck_native_aapt2.sh
            bash scripts/ci/test_android_emulator_smoke.sh
            git diff --exit-code -- design/cartdeck-v03 design/cartdeck-v04 design/cartdeck-v05
          } 2>&1 | tee dist/cartdeck/evidence/asset-checks.log

      - name: Run style and unit tests and build the single standalone APK
        run: |
          set -euo pipefail
          version_code=$(bash scripts/ci/engineering_version_code.sh)
          test "$version_code" -gt 2001
          echo "CARTDECK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "$version_code" > dist/cartdeck/evidence/version-code.txt
          git rev-parse HEAD > dist/cartdeck/evidence/commit-sha.txt
          git submodule status --recursive > dist/cartdeck/evidence/submodule-shas.txt
          export CARTDECK_TEST_VERSION_CODE="$version_code"
          export CARTDECK_HOST_MAVEN_REPO="$GITHUB_WORKSPACE/work/host-input/maven"
          bash scripts/ci/build_native_engine_apk.sh \
            --ps1 work/native-inputs/native-engine-ps1 \
            --psp work/native-inputs/native-engine-psp \
            --dc work/native-inputs/native-engine-dc \
            --gc work/native-inputs/native-engine-gc \
            --ps2 work/native-inputs/native-engine-ps2 \
            --wii \
            --xbox work/xbox-input
          cp work/host-input/provenance.txt dist/cartdeck/evidence/host-provenance.txt

      - name: Print actionable Kotlin lint diagnostics on failure
        if: failure()
        run: |
          for report in lemuroid-app/build/reports/ktlint/*/*.txt retrograde-app-shared/build/reports/ktlint/*/*.txt; do
            if [ -s "$report" ]; then
              echo "::group::$report"
              head -n 120 "$report"
              echo "::endgroup::"
            fi
          done

      - name: Verify the APK and its upgrade identity
        run: |
          set -euo pipefail
          bash scripts/ci/verify_standalone_apk.sh
          python3 scripts/ci/verify_native_bundle_apk.py \
            dist/cartdeck/CARTDECK_STANDALONE_ARM64_DEBUG.apk dist/cartdeck/bundle \
            --require-five-engines --require-wii --require-xbox \
            --host-aar work/host-input/maven/com/github/Swordfish90/LibretroDroid/0.14.0-cartdeck3/LibretroDroid-0.14.0-cartdeck3.aar \
            > dist/cartdeck/evidence/native-bundle-apk.json
          cat dist/cartdeck/evidence/native-bundle-apk.json

      - name: Collect test and native asset evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p dist/cartdeck/evidence
          for source in \
            lemuroid-app/build/test-results/testFreeBundleDebugUnitTest \
            lemuroid-app/build/reports/tests/testFreeBundleDebugUnitTest \
            lemuroid-app/build/reports/cartridge-setup \
            lemuroid-app/build/generated/cartdeck-native/native-assets-manifest.json \
            lemuroid-app/build/generated/cartdeck-native/aapt2-evidence; do
            if [ -e "$source" ]; then
              cp -R "$source" "dist/cartdeck/evidence/$(basename "$(dirname "$source")")-$(basename "$source")"
            fi
          done
          while IFS= read -r manifest; do
            variant="$(basename "$(dirname "$manifest")")"
            cp "$manifest" "dist/cartdeck/evidence/native-assets-$variant.json"
          done < <(find lemuroid-app/build/generated -name native-assets-manifest.json -type f 2>/dev/null)

      # A failing Compose/JVM assertion remains a RED release gate. When the
      # preceding Gradle invocation already assembled an APK, allow the owner
      # to diagnose the current handset behaviour with a distinctly named,
      # non-release, package/signature/native-verified engineering snapshot.
      # Never claim that this is a passing or release-qualified build.
      - name: Prepare an explicitly UNVERIFIED handset QA APK after unit-test failure
        id: device_qa
        if: failure()
        run: |
          set -euo pipefail
          log="dist/cartdeck/evidence/build-and-tests-attempt-1.log"
          if ! test -s "$log" || ! grep -qE '> Task :lemuroid-app:testFreeBundleDebugUnitTest FAILED' "$log"; then
            echo "No failed unit-test build with completed APK; QA snapshot not produced."
            exit 0
          fi
          : "${CARTDECK_VERSION_CODE:?No audited version code}"
          # The existing build script runs JVM tests before assemble. On a test
          # failure no APK normally exists, so the old QA fallback was dead code.
          # Assemble ONLY the identical debug variant from the already verified
          # native bundle after a confirmed JVM-test failure; never skip tests in
          # the release build, and never turn the red workflow green.
          if ! find lemuroid-app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            test -s dist/cartdeck/bundle/native-systems.txt || {
              echo "Complete native bundle unavailable; cannot assemble owner QA APK."
              exit 0
            }
            systems=$(tr -d '\r\n' < dist/cartdeck/bundle/native-systems.txt)
            "$GRADLE_BIN" :lemuroid-app:assembleFreeBundleDebug \
              -Pcartdeck.dev.standaloneId=true \
              -Pcartdeck.p0.phoneArm64Only=true \
              -Pcartdeck.p0.testVersionCode="$CARTDECK_VERSION_CODE" \
              -PcartdeckNativeBundleDir="$GITHUB_WORKSPACE/dist/cartdeck/bundle" \
              -PcartdeckNativeSystems="$systems" \
              -PcartdeckHostMavenRepo="$GITHUB_WORKSPACE/work/host-input/maven" \
              -PcartdeckLibretroDroidVersion=0.14.0-cartdeck3 \
              -Pkotlin.compiler.execution.strategy=in-process \
              --no-daemon --no-configuration-cache --max-workers=2
          fi
          mapfile -t candidates < <(find lemuroid-app/build/outputs/apk -type f -name '*.apk' | sort)
          if [[ "${#candidates[@]}" -ne 1 || ! -s "${candidates[0]}" ]]; then
            echo "No complete APK assembled; QA snapshot not produced."
            exit 0
          fi
          bash scripts/ci/verify_standalone_apk.sh
          python3 scripts/ci/verify_native_bundle_apk.py \
            dist/cartdeck/CARTDECK_STANDALONE_ARM64_DEBUG.apk dist/cartdeck/bundle \
            --require-five-engines --require-wii --require-xbox \
            --host-aar work/host-input/maven/com/github/Swordfish90/LibretroDroid/0.14.0-cartdeck3/LibretroDroid-0.14.0-cartdeck3.aar \
            > dist/cartdeck/evidence/native-bundle-device-qa.json
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c 4 dist/cartdeck/CARTDECK_STANDALONE_ARM64_DEBUG.apk
          mv dist/cartdeck/CARTDECK_STANDALONE_ARM64_DEBUG.apk \
            dist/cartdeck/CARTDECK_DEVICE_QA_NOT_RELEASE.apk
          cat > dist/cartdeck/NOT_RELEASE_READ_FIRST.txt <<EOF
          CARTDECK OWNER DEVICE QA ONLY — NOT A VERIFIED RELEASE
          Source commit: ${GITHUB_SHA}
          Source branch: ${GITHUB_REF_NAME}
          The workflow FAILED JVM unit-test verification. Do not describe this
          artifact as a green build or publish it to users.
          The exact package, debug signature, version and native engine bundle
          passed the existing APK identity/manifest checks independently.
          This snapshot is solely for the owner's manual handset investigation.
          The failing tests and logs remain retained in failure evidence.
          EOF
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload isolated NOT-RELEASE handset QA snapshot
        if: failure() && steps.device_qa.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_DEVICE_QA_UNVERIFIED
          path: |
            dist/cartdeck/CARTDECK_DEVICE_QA_NOT_RELEASE.apk
            dist/cartdeck/NOT_RELEASE_READ_FIRST.txt
            dist/cartdeck/evidence/signing.txt
            dist/cartdeck/evidence/package.txt
            dist/cartdeck/evidence/native-bundle-device-qa.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the verified expansion APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_WII_XBOX_ARM64_DEBUG
          path: |
            dist/cartdeck/CARTDECK_STANDALONE_ARM64_DEBUG.apk
            dist/cartdeck/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failure diagnostics without publishing an unverified APK
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_WII_XBOX_FAILURE_EVIDENCE
          path: dist/cartdeck/evidence/
          if-no-files-found: warn
          retention-days: 7
