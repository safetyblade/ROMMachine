name: CARTDECK Xbox 360 engineering
on:
  push:
    branches: [p1-emu/x360]
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ci/*xbox360*'
      - 'scripts/ci/xbox360_native_abi.py'
      - 'scripts/ci/stage_native_bundle.py'
      - 'scripts/ci/xbox360/**'
      - 'scripts/ci/xbox360-tests/**'
      - '**/Xbox360ContentIdentity.kt'
      - 'lemuroid-app/src/**/xbox360/**'
      - '.github/workflows/cartdeck-xbox360-engineering.yml'
permissions:
  contents: read
concurrency:
  group: xbox360-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK (avoid obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk/cmdline-tools"
          manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$manager" && test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "CARTDECK_SDKMANAGER=$manager" >> "$GITHUB_ENV"
      - run: '"$CARTDECK_SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35"'
      - run: bash scripts/ci/bootstrap_gradle.sh
      - run: '"$GRADLE_BIN" ktlintCheck --no-daemon --max-workers=2'
      - run: '"$CARTDECK_SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-35"'
      - run: '"$GRADLE_BIN" -p scripts/ci/xbox360-tests test --no-daemon --max-workers=2'
      - run: python3 -m unittest discover -s scripts/ci -p 'test_xbox360*.py' -v
  native-xbox360:
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Use preinstalled Android SDK (avoid obsolete tools package)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$sdk/cmdline-tools"
          manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -n "$manager" && test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "CARTDECK_SDKMANAGER=$manager" >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y glslang-tools spirv-tools
      - run: '"$CARTDECK_SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "ndk;29.0.14206865" "cmake;3.30.3" "platforms;android-35"'
      - name: Build pinned native Xbox 360 runtime only
        run: python3 scripts/ci/build_xbox360_native.py "$RUNNER_TEMP/xbox360"
      - uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_XBOX360_NATIVE_ENGINEERING
          path: ${{ runner.temp }}/xbox360
          if-no-files-found: error
  engineering-apk:
    name: Package and verify real opt-in Xenia ARM64 APK
    needs: [source-preflight, native-xbox360]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: CARTDECK_XBOX360_NATIVE_ENGINEERING
          path: work/xbox360-input
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare SDK and source-built pinned graphics host
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
          test -x "$manager"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          "$manager" --sdk_root="$sdk" --install 'ndk;29.0.14206865' 'platforms;android-35' 'build-tools;34.0.0' 'cmake;3.22.1'
          bash scripts/ci/bootstrap_gradle.sh
          export HOST_BUILD_DIR="$RUNNER_TEMP/x360-host"
          export HOST_MAVEN_REPO="$RUNNER_TEMP/x360-host-maven"
          export LIBRETRODROID_SOURCE_DIR="$HOST_BUILD_DIR/source"
          export BUILD_JOBS=2
          bash scripts/ci/build_libretrodroid_host.sh
          echo "CARTDECK_HOST_MAVEN_REPO=$HOST_MAVEN_REPO" >> "$GITHUB_ENV"
      - name: Full lint, JVM/migration checks, APK build, ABI and package verification
        shell: bash
        env:
          CARTDECK_OUTPUT: dist/xbox360
          CARTDECK_TEST_VERSION_CODE: '90611403'
          CARTDECK_REQUIRE_XBOX360: 'true'
          CARTDECK_APK_MAX_MIB: '256'
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_stage_native_bundle.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_native_bundle_apk.py' -v
          bash scripts/ci/build_native_engine_apk.sh --xbox360 work/xbox360-input
      - uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_XBOX360_ARM64_ENGINEERING_APK
          path: dist/xbox360/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xbox360-apk-failure-evidence
          path: |
            dist/xbox360/evidence/
            lemuroid-app/build/test-results/
            lemuroid-app/build/reports/ktlint/
          if-no-files-found: warn
