name: CARTDECK Bookshelf Palette Design Check
on:
  pull_request:
    paths:
      - 'design/cartdeck-v06/**'
      - 'design/cartdeck-v07/**'
      - 'design/cartdeck-v03/editions/green.json'
      - 'design/cartdeck-v04/appearance-editor.json'
      - '.github/workflows/cartdeck-bookshelf-design-check.yml'
  push:
    paths:
      - 'design/cartdeck-v06/**'
      - '.github/workflows/cartdeck-bookshelf-design-check.yml'
jobs:
  verify-shelf-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test colour tokens, contrast and vertical shelf contract
        run: python -m unittest discover design/cartdeck-v06 -p 'test_bookshelf_palette.py' -v
      - name: Verify Original, Pink and Green selector and storage contract
        run: python -m unittest discover design/cartdeck-v07 -p 'test_appearance_selector.py' -v
