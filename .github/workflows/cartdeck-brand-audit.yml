name: CARTDECK Brand Contract

on:
  push:
    branches:
      - feature/cartdeck-visible-rebrand
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout visible brand and source masters
        uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Verify CARTDECK brand identity, resources, continuity and provenance
        run: python3 scripts/audit_cartdeck_brand.py
