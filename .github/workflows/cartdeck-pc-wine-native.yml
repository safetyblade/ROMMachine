name: CARTDECK PC native Android Wine integration
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'spikes/pc/wine-android/**'
      - 'lemuroid-app/src/pcWine/**'
      - '.github/workflows/cartdeck-pc-wine-native.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: pc-wine-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-wine:
    name: Build Android Wine 10 ARM64, WoW64 PE32 translator and driver
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Android NDK and cross-compilation host
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=35 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=35 install -y --no-install-recommends \
            build-essential bison flex cmake ninja-build pkg-config python3 gettext xz-utils
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'ndk;29.0.14206865'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          bash -n spikes/pc/wine-android/build_native_wine.sh
          python3 -m py_compile spikes/pc/wine-android/*.py
      - name: Cross-compile and package exact Android native runtime
        run: bash spikes/pc/wine-android/build_native_wine.sh "$RUNNER_TEMP/pc-native-wine"
      - uses: actions/upload-artifact@v4
        with:
          name: pc-wine-native-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/pc-native-wine/delivery/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pc-wine-native-source-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/pc-native-wine/source-evidence/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc-wine-native-build-logs-${{ github.sha }}
          path: ${{ runner.temp }}/pc-native-wine/logs/
          if-no-files-found: warn
  integration:
    name: Assemble CARTDECK with DOSBox and native Wine (owner-test application ID)
    needs: native-wine
    timeout-minutes: 70
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: pc-wine-native-runtime-${{ github.sha }}
          path: work/pc-wine
      - name: Reuse previously verified isolated DOSBox host
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44454773122
          name: pc-integrated-host-c03f5b6e8cb90e16e7a5e57d1392e6ab18ce024a
          path: work/pc-integration
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44454773122
          name: pc-lab-core-c03f5b6e8cb90e16e7a5e57d1392e6ab18ce024a
          path: work/pc-core
      - name: Reuse unchanged verified console host
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44386451127
          name: native-ci01-libretrodroid-fa6f2712d44cb4795771e3f72690090f2bcc2a6a
          path: work/pc-console-host
      - name: Verify original host receipt and build independent PC candidate
        run: |
          set -euo pipefail
          python3 scripts/ci/ci01_remaining_engines.py --engine libretrodroid --directory work/pc-console-host
          python3 scripts/ci/retain_ci01_host_metadata.py --directory work/pc-console-host
          mkdir -p work/pc-integration/jniLibs/arm64-v8a work/delivery
          cp work/pc-core/libdosbox_pure_libretro_android.so work/pc-integration/jniLibs/arm64-v8a/libcartdeckpc_dosbox.so
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'platforms;android-35' 'build-tools;34.0.0'
          bash scripts/ci/bootstrap_gradle.sh
          gradle_bin="$(sed -n 's/^GRADLE_BIN=//p' "$GITHUB_ENV" | tail -n 1)"
          version_code=$(bash scripts/ci/engineering_version_code.sh)
          "$gradle_bin" ktlintCheck :lemuroid-app:testFreeBundleDebugUnitTest :lemuroid-app:assembleFreeBundleDebug \
            -Pcartdeck.pc.integrationLab=true -PcartdeckPcIntegrationDir="$PWD/work/pc-integration" \
            -PcartdeckPcWineDir="$PWD/work/pc-wine" -Pcartdeck.p0.testVersionCode="$version_code" \
            -Pcartdeck.p0.phoneArm64Only=true \
            -PcartdeckHostMavenRepo="$PWD/work/pc-console-host/maven" -PcartdeckLibretroDroidVersion=0.14.0-cartdeck3 \
            -Pkotlin.compiler.execution.strategy=in-process --no-daemon --no-configuration-cache --max-workers=2
          mapfile -t apks < <(find lemuroid-app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#apks[@]}" = 1
          apk="${apks[0]}"
          case "$apk" in */freeBundle/debug/*.apk) ;; *) exit 1;; esac
          "$sdk/build-tools/34.0.0/aapt" dump badging "$apk" > work/delivery/package.txt
          grep -F "package: name='dev.prestwich.cartdeck.pclab.debug'" work/delivery/package.txt
          "$sdk/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$apk" > work/delivery/signing.txt
          grep -Fi 'Signer #1 certificate SHA-256 digest: ce3ebf1d972c09583470e184d9b86edd20eb4679fedc632d31ac9f58e8741fc8' work/delivery/signing.txt
          python3 spikes/pc/verify_integrated_apk.py "$apk" work/pc-integration/PcLibretroHost.aar \
            work/pc-console-host/maven/com/github/Swordfish90/LibretroDroid/0.14.0-cartdeck3/LibretroDroid-0.14.0-cartdeck3.aar \
            work/pc-integration/jniLibs/arm64-v8a/libcartdeckpc_dosbox.so
          python3 spikes/pc/wine-android/verify_native_apk.py "$apk" work/pc-wine
          cp "$apk" work/delivery/CARTDECK-PC-WINE-INTEGRATION.apk
          cp work/pc-wine/provenance.txt work/delivery/
          sha256sum work/delivery/*.apk > work/delivery/apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pc-wine-integration-apk-${{ github.sha }}
          path: work/delivery/
          if-no-files-found: error
