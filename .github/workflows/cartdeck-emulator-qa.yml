name: CARTDECK emulator QA (universal, non-delivery)

# Independent synthetic emulator continuity check. This intentionally does not
# modify the single-ARM64 delivery workflow, nor publish a second release APK.
on:
  workflow_dispatch:
  push:
    branches:
      - qa/cartdeck-emulator-continuity

permissions:
  contents: read

concurrency:
  group: cartdeck-emulator-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-qa:
    name: Universal QA APKs, in-place update and screenshot evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout approved previous master (schema 10, P1-A2 1/4)
        uses: actions/checkout@v4
        with:
          path: baseline
          ref: 39cf6f1ec5ac8d9596db626ca5598728f0f4f950
          submodules: recursive
          persist-credentials: false

      - name: Checkout latest candidate with QA scripts
        uses: actions/checkout@v4
        with:
          path: candidate
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Prepare QA evidence
        run: |
          mkdir -p qa/apks qa/evidence
          git -C baseline rev-parse HEAD > qa/evidence/baseline-sha.txt
          git -C candidate rev-parse HEAD > qa/evidence/candidate-sha.txt
          echo "Universal emulator test APKs only, never the delivery ARM64 artifact." > qa/evidence/qa-scope.txt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          printf '%s\n' "$sdk_root/platform-tools" "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > qa/evidence/sdk-licenses.log
          "$manager" --sdk_root="$sdk_root" --install 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0'

      - name: Restore verified Gradle distribution cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cartdeck-gradle/*.zip
          key: gradle-distribution-${{ runner.os }}-${{ hashFiles('candidate/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap checksum-verified Gradle once
        run: |
          set -euo pipefail
          (cd candidate && bash scripts/ci/bootstrap_gradle.sh) 2>&1 | tee qa/evidence/gradle-bootstrap.log

      - name: Build OLD universal x86_64-compatible test APK
        run: |
          set -euo pipefail
          (cd baseline && "$GRADLE_BIN" :lemuroid-app:assembleFreeBundleDebug \
            -Pcartdeck.dev.standaloneId=true -Pcartdeck.p0.testVersionCode=4001 \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon --no-configuration-cache --max-workers=2 --stacktrace) \
            2>&1 | tee qa/evidence/old-build.log
          mapfile -t apks < <(find baseline/lemuroid-app/build/outputs/apk/freeBundle/debug -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" qa/apks/baseline-universal.apk

      - name: Run candidate tests and build NEW universal QA APK
        run: |
          set -euo pipefail
          (cd candidate && "$GRADLE_BIN" ktlintCheck :lemuroid-app:testFreeBundleDebugUnitTest :lemuroid-app:assembleFreeBundleDebug \
            -Pcartdeck.dev.standaloneId=true -Pcartdeck.p0.testVersionCode=4002 \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon --no-configuration-cache --max-workers=2 --stacktrace) \
            2>&1 | tee qa/evidence/new-build-and-tests.log
          mapfile -t apks < <(find candidate/lemuroid-app/build/outputs/apk/freeBundle/debug -name '*.apk' -type f)
          test "${#apks[@]}" -eq 1
          cp "${apks[0]}" qa/apks/candidate-universal.apk
          sha256sum qa/apks/*.apk > qa/evidence/universal-apk-checksums.txt

      - name: Android emulator: same-signature in-place update and home screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -no-audio
          script: bash candidate/scripts/ci/universal_emulator_update_smoke.sh qa/apks/baseline-universal.apk qa/apks/candidate-universal.apk qa/evidence

      - name: Record outcome scope
        if: always()
        run: |
          {
            echo 'Synthetic update means same package/signer, greater versionCode, app-private marker preserved, both launches foreground and true screenshots.'
            echo 'This does NOT prove ROM imports, SRAM/manual state, real app library or visual shelf fidelity with populated titles.'
            echo 'No cleanup, app uninstall, replacement of delivery APK or production release approval occurred.'
          } >> qa/evidence/limitations.txt

      - name: Upload non-delivery universal QA APK and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_EMULATOR_UNIVERSAL_QA_NOT_FOR_DELIVERY
          path: |
            qa/evidence/
            qa/apks/candidate-universal.apk
          if-no-files-found: warn
          retention-days: 7
