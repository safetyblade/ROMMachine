name: CARTDECK CI-01 verified APK modes
run-name: CI-01 ${{ inputs.build_mode }} at ${{ github.sha }}

# Opt-in acceptance path. The normal APK workflow stays unchanged until QA accepts
# the ten-component inventory, reuse matrix and exact-source APK evidence.
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Use ten verified native receipts; missing engines fail without compilation'
        type: choice
        required: true
        default: FAST_TEST_APK
        options:
          - FAST_TEST_APK
          - FULL_INTEGRATION_APK

permissions:
  contents: read
  actions: read

concurrency:
  group: ci01-apk-${{ inputs.build_mode }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-apk:
    uses: ./.github/workflows/cartdeck-connected-engines-apk.yml
    with:
      use_ci01_all_native: true
      measure_apk_reuse: ${{ inputs.build_mode == 'FULL_INTEGRATION_APK' }}
