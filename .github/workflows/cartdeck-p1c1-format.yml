name: CARTDECK P1-C1 one-time Kotlin formatter
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/cartdeck-p1c1-format.yml']
  push:
    branches: ['feature/cartdeck-p1c1-appearance-v2']
    paths: ['.github/workflows/cartdeck-p1c1-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/cartdeck-p1c1-appearance-v2
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Gradle distribution
        run: bash scripts/ci/bootstrap_gradle.sh
      - name: Autoformat scoped Kotlin sources and tests
        run: |
          set -euo pipefail
          "$GRADLE_BIN" :lemuroid-app:ktlintMainSourceSetFormat :lemuroid-app:ktlintTestSourceSetFormat --no-daemon
      - name: Commit bounded formatting and retire this temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'CARTDECK CI Formatter'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/shelf/AppearanceSelector.kt
          git add lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/shelf/{ShelfLayout,ShelfMaterials,ShelfStore,ShelfEditors,ShelfViewModel}.kt
          git add lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/shared/compose/ui/{Cartridge,CartridgePainter,CartdeckEditionTokens}.kt
          git add lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/feature/main/MainActivity.kt
          git add lemuroid-app/src/test/java/com/swordfish/lemuroid/app/mobile/feature/shelf/{ShelfLayoutTest,LibraryRefreshStorageFailureTest}.kt
          rm .github/workflows/cartdeck-p1c1-format.yml
          git add -u .github/workflows/cartdeck-p1c1-format.yml
          if ! git diff --cached --quiet; then
            git commit -m 'style(P1-C1): apply scoped Kotlin formatter and retire temporary formatting job'
            git push origin HEAD:feature/cartdeck-p1c1-appearance-v2
          fi
