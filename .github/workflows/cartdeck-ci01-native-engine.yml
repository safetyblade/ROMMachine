name: CARTDECK CI-01 selective native engine proof

# Initial bounded CI-C implementation: Five existing Libretro engines. Remaining native backends migrate
# after their provenance and package contracts are verified.
on:
  pull_request:
    paths:
      - 'scripts/ci/ci01_*.py'
      - 'scripts/ci/issue_native_receipt.py'
      - 'scripts/ci/resolve_native_artifacts.py'
      - 'scripts/ci/measure_apk_build.py'
      - 'scripts/ci/test_measure_apk_build.py'
      - 'scripts/ci/retain_ci01_sources.py'
      - 'scripts/ci/test_retain_ci01_sources.py'
      - 'scripts/ci/retain_ci01_host_metadata.py'
      - 'scripts/ci/test_retain_ci01_host_metadata.py'
      - 'scripts/ci/test_ci01_*.py'
      - '.github/workflows/cartdeck-ci01-native-engine.yml'
  workflow_call:
    inputs:
      engine:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      engine:
        description: 'Native component to rebuild'
        type: choice
        required: true
        options:
          - ps1
          - psp
          - dc
          - gc
          - ps2
          - hakux
          - xenia
          - armsx2
          - cemu
          - libretrodroid

permissions:
  contents: read
  actions: write

concurrency:
  group: cartdeck-ci01-native-${{ inputs.engine }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provenance-source-tests:
    name: Verify native receipt and identity contracts without compilation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native scripts and Python syntax without building emulators
        run: |
          set -euo pipefail
          bash -n scripts/ci/build_connected_native_inputs.sh
          bash -n scripts/ci/build_libretrodroid_host.sh
          python3 -m compileall -q scripts/ci/ci01_remaining_engines.py \
            scripts/ci/ci01_legacy_engines.py scripts/ci/issue_native_receipt.py \
            scripts/ci/resolve_native_artifacts.py scripts/ci/verify_ci01_ps1.py \
            scripts/ci/measure_apk_build.py
      - name: Execute all CI-01 producer and consumer regression tests
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_resolve_native_artifacts.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_issue_native_receipt.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_ci01_legacy_engines.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_ci01_remaining_engines.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_ci01_ps1.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_measure_apk_build.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_retain_ci01_sources.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_retain_ci01_host_metadata.py' -v
  native-component:
    if: inputs.engine != ''
    name: Verify and retain one genuine native component
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate selected native component
        env:
          SELECTED_ENGINE: ${{ inputs.engine }}
        run: |
          case "$SELECTED_ENGINE" in
            ps1|psp|dc|gc|ps2|hakux|xenia|armsx2|cemu|libretrodroid) ;;
            *) echo '::error::Unsupported native component'; exit 2 ;;
          esac
      - name: Validate native provenance test suite
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_resolve_native_artifacts.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_issue_native_receipt.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_ci01_legacy_engines.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_ci01_remaining_engines.py' -v
      - name: Find an existing source-matched recovery component
        if: contains(fromJSON('["cemu","xenia"]'), inputs.engine)
        id: cached
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const prefix = 'native-ci01-${{ inputs.engine }}-';
            let artifacts;
            try {
              artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo, per_page:100});
            } catch (error) {
              if (![500, 502, 503, 504].includes(error.status)) throw error;
              core.warning('Native artifact cache unavailable (GitHub 5xx); build verified pinned source instead');
              return;
            }
            for (const a of artifacts.filter(a => !a.expired && a.name.startsWith(prefix)).sort((a,b) => new Date(b.created_at)-new Date(a.created_at))) {
              const id = a.workflow_run?.id;
              if (!id || String(id) === String(context.runId)) continue;
              const run = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:id})).data;
              if (run.head_repository?.full_name !== context.repo.owner+'/'+context.repo.repo) continue;
              if (!['.github/workflows/cartdeck-ci01-native-engine.yml','.github/workflows/cartdeck-emu-recovery.yml'].includes(run.path)) continue;
              let passed = run.conclusion === 'success';
              if (!passed && run.path.endsWith('cartdeck-emu-recovery.yml')) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,{...context.repo,run_id:id,per_page:100});
                passed = jobs.some(j => j.name.includes('${{ inputs.engine }}') && j.name.endsWith('Verify and retain one genuine native component') && j.conclusion === 'success');
              }
              if (!passed) continue;
              // Reject native recipe changes before downloading a large candidate.
              // Receipt verification below remains authoritative for every byte.
              // Cemu requires an exact receipt for the core and the host.
              if ('${{ inputs.engine }}' === 'xenia') {
                const producer = a.name.slice(prefix.length);
                if (!/^[0-9a-f]{40}$/.test(producer)) continue;
                const comparison = (await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo, basehead: producer + '...' + context.sha,
                })).data;
                const {execFileSync} = require('node:child_process');
                const recipe = JSON.parse(execFileSync('python3', ['-c',
                  'import sys,json;sys.path.insert(0,"scripts/ci");from ci01_remaining_engines import build_recipe_files;print(json.dumps(build_recipe_files("xenia")))'
                ], {encoding:'utf8'}));
                const files = comparison.files;
                if (!files || files.length >= 300 || files.some(f =>
                  recipe.includes(f.filename) || recipe.includes(f.previous_filename) ||
                  f.filename.startsWith('scripts/ci/xbox360/') ||
                  (f.previous_filename || '').startsWith('scripts/ci/xbox360/'))) continue;
              }
              core.setOutput('id',String(a.id)); core.setOutput('run',String(id)); break;
            }
      - name: Download candidate for strict recipe verification
        if: steps.cached.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          artifact-ids: ${{ steps.cached.outputs.id }}
          run-id: ${{ steps.cached.outputs.run }}
          path: work/verified-reuse
          merge-multiple: true
      - name: Reuse only after immutable input and output verification
        id: reuse
        shell: bash
        run: |
          set -euo pipefail
          valid=false
          if [[ -f work/verified-reuse/receipt.json ]]; then
            if python3 scripts/ci/ci01_remaining_engines.py --engine '${{ inputs.engine }}' --directory work/verified-reuse; then
              valid=true
              if [[ '${{ inputs.engine }}' == cemu ]]; then
                if ! python3 -c 'import sys,json;sys.path.insert(0,"scripts/ci");from wiiu_cemu_contract import require_guest_atomic64, require_visible_drc_guard;proof=json.load(open("work/verified-reuse/native-evidence.json"));require_guest_atomic64(proof);require_visible_drc_guard(proof)'; then valid=false; fi
              fi
            fi
          fi
          if [[ "$valid" == true ]]; then
            mkdir -p 'work/ci01-reusable/${{ inputs.engine }}'
            cp -a work/verified-reuse/. 'work/ci01-reusable/${{ inputs.engine }}/'
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
      - name: Prepare pinned Android NDK
        if: steps.reuse.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk" --install 'ndk;29.0.14206865' 'cmake;3.30.3'
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
      - name: Compile selected pinned native source only
        if: steps.reuse.outputs.valid != 'true'
        shell: bash
        run: bash scripts/ci/build_connected_native_inputs.sh "${{ inputs.engine }}"
      - name: Verify five-core source identity, core and assets; issue immutable receipt
        if: contains(fromJSON('["ps1","psp","dc","gc","ps2"]'), inputs.engine)
        shell: bash
        run: |
          set -euo pipefail
          engine="${{ inputs.engine }}"
          dir="work/connected/legacy/native-engine-$engine"
          python3 scripts/ci/ci01_legacy_engines.py --engine "$engine" --directory "$dir" --issue
          python3 scripts/ci/ci01_legacy_engines.py --engine "$engine" --directory "$dir"
      - name: Retain independently verified five-core native output
        if: contains(fromJSON('["ps1","psp","dc","gc","ps2"]'), inputs.engine)
        uses: actions/upload-artifact@v4
        with:
          name: native-ci01-${{ inputs.engine }}-${{ github.sha }}
          path: work/connected/legacy/native-engine-${{ inputs.engine }}/
          if-no-files-found: error
          retention-days: 90
      - name: Package exact ARMSX2 native resources and licences
        if: inputs.engine == 'armsx2'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_ps2_android_resources.py' -v
          python3 scripts/ci/package_ps2_runtime_support.py \
            --work work/connected/armsx2 --ndk "$ANDROID_HOME/ndk/29.0.14206865"
      - name: Stage and independently verify selected backend receipt
        if: contains(fromJSON('["hakux","xenia","armsx2","cemu","libretrodroid"]'), inputs.engine) && steps.reuse.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          engine="${{ inputs.engine }}"
          case "$engine" in
            hakux) source=work/connected/hakux ;;
            xenia) source=work/connected/xenia ;;
            armsx2) source=work/connected/armsx2 ;;
            cemu) source=work/connected/cemu ;;
            libretrodroid) source="$RUNNER_TEMP/connected-libretrodroid-source" ;;
            *) exit 2 ;;
          esac
          python3 scripts/ci/ci01_remaining_engines.py \
            --engine "$engine" --source "$source" --directory "work/ci01-reusable/$engine"
          python3 scripts/ci/ci01_remaining_engines.py \
            --engine "$engine" --directory "work/ci01-reusable/$engine"
      - name: Retain receipt-covered corresponding source with native inputs
        if: contains(fromJSON('["hakux","armsx2","xenia"]'), inputs.engine) && steps.reuse.outputs.valid != 'true'
        shell: bash
        run: |
          python3 scripts/ci/retain_ci01_sources.py --engine "${{ inputs.engine }}" \
            --source "work/connected/${{ inputs.engine }}" \
            --directory "work/ci01-reusable/${{ inputs.engine }}"
      - name: Retain host Maven metadata needed by APK consumers
        if: inputs.engine == 'libretrodroid'
        run: |
          python3 scripts/ci/retain_ci01_host_metadata.py \
            --source "$RUNNER_TEMP/connected-libretrodroid-source" \
            --directory work/ci01-reusable/libretrodroid
      - name: Retain independent verified backend artifact
        if: contains(fromJSON('["hakux","xenia","armsx2","cemu","libretrodroid"]'), inputs.engine)
        uses: actions/upload-artifact@v4
        with:
          name: native-ci01-${{ inputs.engine }}-${{ github.sha }}
          path: work/ci01-reusable/${{ inputs.engine }}/
          if-no-files-found: error
          retention-days: 90
      - name: Publish native failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci01-native-failure-${{ github.run_id }}
          path: |
            work/connected/legacy/native-engine-ps1/provenance.txt
            work/connected/legacy/native-engine-ps1/elf-file.txt
          if-no-files-found: warn
