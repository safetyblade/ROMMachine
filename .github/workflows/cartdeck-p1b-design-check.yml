name: CARTDECK P1-B Stage 1 Design Assets
on:
  pull_request:
    paths:
      - 'design/cartdeck-p1b/**'
      - '.github/workflows/cartdeck-p1b-design-check.yml'
  push:
    paths:
      - 'design/cartdeck-p1b/**'
      - '.github/workflows/cartdeck-p1b-design-check.yml'
jobs:
  validate-design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source-art transparency, game aspect and control profile
        run: python -m unittest discover design/cartdeck-p1b -p 'test_shell_stage1.py' -v
