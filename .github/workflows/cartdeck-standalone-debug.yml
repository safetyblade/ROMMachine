name: CARTDECK APK

# One native pipeline owns compilation, tests and verified engineering artifacts.
# Includes all five existing engines plus Wii and the internal Xbox backend.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cartdeck-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-preflight:
    name: Verify current LibretroDroid receipt
    if: >-
      (github.ref == 'refs/heads/master' && github.event_name != 'pull_request') ||
      (github.event_name == 'pull_request' && github.head_ref == 'engineering/br001-integrated-qa')
    runs-on: ubuntu-24.04
    outputs:
      valid: ${{ steps.check.outputs.valid }}
      run: ${{ steps.candidate.outputs.run }}
      name: ${{ steps.candidate.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test BR-001 timing mailbox and audio bounds
        run: python3 -m unittest discover -s scripts/ci -p 'test_br001_timing_patch.py' -v
      - name: Find newest trusted host producer
        id: candidate
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = 'native-ci01-libretrodroid-';
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              ...context.repo, per_page: 100
            });
            for (const artifact of all.filter(a => !a.expired && a.name.startsWith(prefix))
                .sort((a,b) => new Date(b.created_at) - new Date(a.created_at))) {
              const id = artifact.workflow_run?.id;
              if (!id || String(id) === String(context.runId)) continue;
              const run = (await github.rest.actions.getWorkflowRun({...context.repo, run_id: id})).data;
              if (run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo) continue;
              const dispatched = run.event === 'workflow_dispatch' &&
                run.path === '.github/workflows/cartdeck-ci01-native-engine.yml' &&
                artifact.name === prefix + run.head_sha;
              const pc = run.event === 'pull_request' &&
                run.path === '.github/workflows/cartdeck-pc-host-recovery.yml' &&
                run.head_branch?.startsWith('engineering/perf-pc01-input-continuation-') &&
                new RegExp('^' + prefix + '[0-9a-f]{40}$').test(artifact.name);
              let trusted = run.conclusion === 'success' && (dispatched || pc);
              if (!trusted && run.status === 'completed' && run.head_branch === 'master' &&
                  run.path === '.github/workflows/cartdeck-standalone-debug.yml' &&
                  artifact.name === prefix + run.head_sha) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo, run_id: id, per_page: 100
                });
                trusted = jobs.some(j => j.name.startsWith('Refresh LibretroDroid only / ') &&
                  j.name.endsWith('Verify and retain one genuine native component') && j.conclusion === 'success');
              }
              if (!trusted) continue;
              core.setOutput('run', String(id));
              core.setOutput('name', artifact.name);
              return;
            }
      - name: Download candidate receipt and native host
        if: steps.candidate.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run }}
          name: ${{ steps.candidate.outputs.name }}
          path: work/host-preflight
      - name: Require exact current native recipe and receipt-covered Maven metadata
        id: check
        run: |
          set -euo pipefail
          valid=false
          if [[ -f work/host-preflight/receipt.json ]]; then
            if python3 scripts/ci/retain_ci01_host_metadata.py --directory work/host-preflight; then
              valid=true
            fi
          fi
          echo "valid=$valid" >> "$GITHUB_OUTPUT"
          if [[ "$valid" != true ]]; then
            echo "Only LibretroDroid requires a source rebuild; all other engine receipts remain mandatory."
          fi

  host-refresh:
    name: Refresh LibretroDroid only
    needs: host-preflight
    if: needs.host-preflight.outputs.valid == 'false'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cartdeck-ci01-native-engine.yml
    with:
      engine: libretrodroid
    secrets: inherit

  engineering:
    name: Complete CARTDECK ARM64 APK
    needs: [host-preflight, host-refresh]
    if: >-
      always() && !cancelled() &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      !startsWith(github.head_ref, 'engineering/emu-recovery-') &&
      !startsWith(github.head_ref, 'engineering/perf-pc01-input-continuation-') &&
      ((github.ref != 'refs/heads/master' && github.head_ref != 'engineering/br001-integrated-qa') ||
        (needs.host-preflight.result == 'success' &&
          (needs.host-refresh.result == 'success' ||
            (needs.host-refresh.result == 'skipped' && needs.host-preflight.outputs.valid == 'true'))))
    uses: ./.github/workflows/cartdeck-connected-engines-apk.yml
    with:
      include_ps3: false
      use_ci01_all_native: true
      pc_host_native_run_id: ${{ needs.host-refresh.result == 'success' && format('{0}', github.run_id) || '' }}
      pc_host_reuse_run_id: ${{ needs.host-preflight.outputs.valid == 'true' && needs.host-preflight.outputs.run || '' }}
      pc_host_reuse_artifact_name: ${{ needs.host-preflight.outputs.valid == 'true' && needs.host-preflight.outputs.name || '' }}
      publish_apk: true
    secrets: inherit

  ps3-inputs:
    name: Resolve verified PS3 owner-test engines
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: engineering
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.sources.outputs.run }}
    steps:
      - name: Resolve both verified PS3 native inputs
        id: sources
        uses: actions/github-script@v7
        with:
          script: |
            const names = ['PS3_ENGINE_armsx3', 'PS3_ENGINE_rpcs3-libretro'];
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'cartdeck-ps3-source.yml',
              status: 'success', per_page: 50
            });
            for (const run of runs) {
              if (run.head_repository?.full_name !== context.repo.owner + '/' + context.repo.repo) continue;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100
              });
              if (names.every(name => artifacts.filter(a => a.name === name && !a.expired).length === 1)) {
                core.setOutput('run', String(run.id));
                core.info('Both PS3 engine inputs selected from verified run ' + run.id);
                return;
              }
            }
            core.setFailed('No successful PS3 source run with both current unexpired artifacts. Refresh PS3 inputs only.');

  ps3-owner-engineering:
    name: Complete CARTDECK ARM64 APK with PS3 (owner test)
    needs: [engineering, ps3-inputs, host-preflight, host-refresh]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.engineering.result == 'success' &&
      needs.ps3-inputs.result == 'success'
    uses: ./.github/workflows/cartdeck-connected-engines-apk.yml
    with:
      include_ps3: true
      ps3_run_id: ${{ needs.ps3-inputs.outputs.run }}
      use_ci01_all_native: true
      pc_host_native_run_id: ${{ needs.host-refresh.result == 'success' && format('{0}', github.run_id) || '' }}
      pc_host_reuse_run_id: ${{ needs.host-preflight.outputs.valid == 'true' && needs.host-preflight.outputs.run || '' }}
      pc_host_reuse_artifact_name: ${{ needs.host-preflight.outputs.valid == 'true' && needs.host-preflight.outputs.name || '' }}
      ps3_development_integration: true
      ps3_owner_test: true
      distribution_licensing_cleared: false
      publish_apk: false
    secrets:
      CARTDECK_OWNER_TEST_PASSPHRASE: ${{ secrets.CARTDECK_OWNER_TEST_PASSPHRASE }}

  griparc-engineering-review:
    name: Mark GripArc PR ready after source and APK gates
    needs: engineering
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 152 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/pivotarc-griparc-joint'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mark this verified head ready for engineering review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERIFIED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current_head=$(gh api "repos/$GH_REPO/pulls/152" --jq '.head.sha')
          if [[ "$current_head" != "$VERIFIED_HEAD" ]]; then
            echo 'A newer head needs its own gates; leaving review state unchanged.'
            exit 0
          fi
          is_draft=$(gh api "repos/$GH_REPO/pulls/152" --jq '.draft')
          if [[ "$is_draft" == true ]]; then
            gh pr ready 152 --repo "$GH_REPO"
          fi

  ui-merge-gate:
    name: UI merge gate (verified APK)
    needs: engineering
    if: ${{ always() && github.event_name == 'pull_request' && github.base_ref == 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require successful APK and unit suite for changed UI
        uses: actions/github-script@v7
        env:
          APK_RESULT: ${{ needs.engineering.result }}
        with:
          script: |
            const changed = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const ui = /^(lemuroid-app\/src\/[^/]+\/(java\/com\/swordfish\/lemuroid\/app\/(mobile|tv)\/|res\/)|design\/|scripts\/generate_cartdeck_native_assets\.py$|\.github\/workflows\/cartdeck-standalone-debug\.yml$)/;
            const matches = changed.filter(file =>
              ui.test(file.filename) || ui.test(file.previous_filename || ''));
            if (!matches.length) {
              core.info('No UI-scoped changes; the responsible engineering lane retains its own checks.');
              return;
            }
            core.info('UI changes: ' + matches.map(file => file.filename).join(', '));
            if (process.env.APK_RESULT !== 'success') {
              core.setFailed('UI changes require a successful complete APK build and unit suite for this merge tree. Result: ' +
                process.env.APK_RESULT);
              return;
            }
            core.info('Verified APK and mandatory tests passed for this pull request merge tree.');
