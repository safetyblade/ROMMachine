name: CARTDECK PERF-02 integrated ARM64 candidate APK

# Engineering QA only: the known-working cores remain the default.
# Manual-only until an explicit source/combined-binary distribution clearance.
# No pull_request or push trigger may publish experimental emulator binaries.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cartdeck-perf02-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Two pinned cores, in-app selection, test APK
    # A repository variable is deliberately false/unset until Daniel clears
    # licences, source correspondence, distribution and owner release.
    if: ${{ vars.CARTDECK_EXPERIMENTAL_CORE_DISTRIBUTION_APPROVED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate and pinned baseline cores
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned Android SDK and NDK
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$manager"
          "$manager" --sdk_root="$sdk_root" --licenses < <(yes) > /dev/null
          "$manager" --sdk_root="$sdk_root" --install 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;34.0.0'
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Compile separately pinned official PS1 and PSP Libretro cores
        run: |
          set -euo pipefail
          bash scripts/ci/build_ps1_upstream_core.sh "$GITHUB_WORKSPACE/dist/perf02/ps1"
          bash scripts/ci/build_psp_upstream_core.sh "$GITHUB_WORKSPACE/dist/perf02/psp"

      - name: Package candidates and matching support assets without replacing old versions
        run: |
          set -euo pipefail
          libs="lemuroid-app/src/main/jniLibs/arm64-v8a"
          assets="lemuroid-app/src/main/assets/cartdeck"
          mkdir -p "$libs" "$assets"
          cp dist/perf02/ps1/libpcsx_rearmed_modern_libretro_android.so "$libs/"
          cp dist/perf02/psp/libppsspp_modern_libretro_android.so "$libs/"
          cp dist/perf02/ps1/pcsx-rearmed-modern.properties "$assets/"
          cp dist/perf02/psp/ppsspp-modern-assets.zip dist/perf02/psp/ppsspp-modern.properties "$assets/"
          sha256sum "$libs/"*modern* "$assets/ppsspp-modern-assets.zip" > dist/perf02/packaged-hashes.txt
          git rev-parse HEAD > dist/perf02/integration-source-sha.txt
          git submodule status --recursive > dist/perf02/submodule-revisions.txt

      - name: Verify baseline native cores are still present in source
        run: |
          set -euo pipefail
          find lemuroid-cores -name 'libpcsx_rearmed_libretro_android.so' -o -name 'libppsspp_libretro_android.so' | tee dist/perf02/legacy-core-paths.txt
          test "$(wc -l < dist/perf02/legacy-core-paths.txt)" -ge 2 || {
            echo "::error::Known-working PS1 and PSP native cores missing from source"
            exit 1
          }

      - name: Restore verified Gradle and dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap checksum-verified Gradle
        run: |
          set -euo pipefail
          bash scripts/ci/bootstrap_gradle.sh

      - name: Run Android tests and build exactly one signed standalone ARM64 QA APK
        env:
          CARTDECK_OUTPUT: dist/perf02/cartdeck
        run: |
          set -euo pipefail
          mkdir -p "$CARTDECK_OUTPUT/evidence"
          version_code=$((70000 + GITHUB_RUN_NUMBER))
          echo "CARTDECK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          bash scripts/ci/build_standalone_apk.sh "$version_code"

      - name: Verify installed package identity, signer, contents and candidate presence
        env:
          CARTDECK_OUTPUT: dist/perf02/cartdeck
        run: |
          set -euo pipefail
          bash scripts/ci/verify_standalone_apk.sh
          apk="$CARTDECK_OUTPUT/CARTDECK_STANDALONE_ARM64_DEBUG.apk"
          unzip -Z1 "$apk" | tee dist/perf02/apk-file-list.txt
          grep -q '^lib/arm64-v8a/libpcsx_rearmed_modern_libretro_android.so$' dist/perf02/apk-file-list.txt
          grep -q '^lib/arm64-v8a/libppsspp_modern_libretro_android.so$' dist/perf02/apk-file-list.txt
          grep -q '^assets/cartdeck/ppsspp-modern-assets.zip$' dist/perf02/apk-file-list.txt

      - name: Document device-acceptance limitation
        if: always()
        run: |
          {
            echo 'Candidate APK is an engineering QA artifact, not a released or accepted engine promotion.'
            echo 'Compiled binaries and Kotlin tests do not prove actual ROM gameplay, save restoration or compatibility on a phone.'
            echo 'Requires Marcus physical-device test for Dead Ball Zone match, NBA 2K13 match, WWE 2007 match and GTA Liberty City Stories loading.'
            echo 'Original legacy engines remain recommended until owner approves a verified candidate.'
          } > dist/perf02/limitations.txt

      - name: Upload engineering QA APK and binary provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CARTDECK_PERF02_INTEGRATED_ARM64_QA_NOT_FOR_RELEASE
          path: dist/perf02/
          if-no-files-found: warn
          retention-days: 21
