name: CARTDECK GC-01 Dolphin Android ARM64 executable core build (not shipped)

on:
  pull_request:
    paths:
      - ".github/workflows/cartdeck-gc01-dolphin-arm64.yml"
      - "spikes/nextgen/**"
      - "scripts/ci/build_gamecube_upstream_core.sh"
      - "scripts/ci/verify_gamecube_core.py"
      - "scripts/ci/test_verify_gamecube_core.py"
      - "lemuroid-app/src/debug/**"
      - "retrograde-app-shared/src/main/java/com/swordfish/lemuroid/lib/core/assetsmanager/Dolphin*.kt"
      - "lemuroid-app/src/test/java/com/swordfish/lemuroid/app/gamecube/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc-media:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collision-safe GameCube and Wii disc regression
        run: |
          python3 -m unittest discover -s spikes/nextgen -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_gamecube_core.py' -v

  dolphin-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      NDK_REV: 29.0.14206865
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK r29 and native build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake pkg-config
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_REV"
          test -f "$ANDROID_HOME/ndk/$NDK_REV/build/cmake/android.toolchain.cmake"
      - name: Build and stage matching private-test core and system resources
        shell: bash
        run: |
          set -euo pipefail
          # No artifact upload: experimental binaries await distribution clearance.
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_REV" \
            scripts/ci/build_gamecube_upstream_core.sh "$RUNNER_TEMP/gc01-package"
          {
            cat "$RUNNER_TEMP/gc01-package/provenance.txt"
            cat "$RUNNER_TEMP/gc01-package/sha256.txt"
            echo "NATIVE BUILD PASS; Android rendering/audio/controls/saves NOT TESTED."
          } >> "$GITHUB_STEP_SUMMARY"
