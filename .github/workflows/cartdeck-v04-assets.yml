name: Cartdeck visual asset catalog
on:
  pull_request:
    paths:
      - 'design/cartdeck-v03/**'
      - 'design/cartdeck-v04/**'
      - 'design/cartdeck-v05/**'
      - '.github/workflows/cartdeck-v04-assets.yml'
      - 'scripts/generate_cartdeck_native_assets.py'
      - 'scripts/ci/test_cartdeck_native_assets.py'
      - 'scripts/ci/check_cartdeck_native_aapt2.sh'
      - 'lemuroid-app/build.gradle.kts'
      - 'lemuroid-app/src/main/java/com/swordfish/lemuroid/app/mobile/shared/compose/ui/CartdeckEditionTokens.kt'
  push:
    paths:
      - 'design/cartdeck-v03/**'
      - 'design/cartdeck-v04/**'
      - 'design/cartdeck-v05/**'
      - 'scripts/generate_cartdeck_native_assets.py'
      - 'scripts/ci/test_cartdeck_native_assets.py'
jobs:
  verify-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate earlier identity geometry
        run: python -m unittest discover design/cartdeck-v03 -p 'test_dpad_consistency.py'
      - name: Validate universal catalog and shelf interaction contracts
        run: python -m unittest discover design/cartdeck-v04 -p 'test_assets.py'
      - name: Verify single original cartridge family
        run: python -m unittest discover design/cartdeck-v05 -p 'test_cartridge_family.py'
      - name: Generate per-edition cosmetic SVGs
        run: python design/cartdeck-v04/build_assets.py
      - name: Convert approved colours to Android VectorDrawable previews
        run: python design/cartdeck-v04/export_android_vectors.py
      - name: Verify parseable native vectors and edition-safe geometry
        run: python -m unittest discover design/cartdeck-v04 -p 'test_android_export.py'
      - name: Generate native Android resource source set and provenance manifest
        run: python scripts/generate_cartdeck_native_assets.py --output lemuroid-app/build/generated/cartdeck-native/res
      - name: Verify Original/Pink parity, 4.5:1 text contrast, 3:1 focus and stable output
        run: python -m unittest discover scripts/ci -p 'test_cartdeck_native_assets.py' -v
      - name: Compile generated CARTDECK resources through Android AAPT2 (no Gradle)
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/check_cartdeck_native_aapt2.sh
          bash scripts/ci/check_cartdeck_native_aapt2.sh
      - name: Archive native asset source-to-resource traceability for Sienna and Daniel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cartdeck-asset-h1-evidence-${{ github.run_id }}
          path: |
            lemuroid-app/build/generated/cartdeck-native/native-assets-manifest.json
            lemuroid-app/build/generated/cartdeck-native/res/values/cartdeck_edition_colors.xml
            lemuroid-app/build/generated/cartdeck-native/aapt2-evidence/
          if-no-files-found: warn
          retention-days: 30
      - name: Ensure generated files did not alter tracked masters
        run: git diff --exit-code -- design/cartdeck-v03 design/cartdeck-v04 design/cartdeck-v05
