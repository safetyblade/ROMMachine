<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARTDECK GripArc V1 — Assets</title>
<style>*{box-sizing:border-box}body{background:#0C1421;color:#F2F6F6;font:15px system-ui,sans-serif;padding:20px;margin:0}header{max-width:1100px;margin:auto}h1{font-size:24px}p{color:#B1C7D0} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;max-width:1100px;margin:24px auto}.card{background:#152334;border:1px solid #385569;border-radius:14px;padding:14px;min-height:315px}.card h2{font-size:16px;margin:4px 0 8px}.card img{width:100%;height:275px;object-fit:contain;filter:drop-shadow(0 5px 7px #0009)}button{border:1px solid #4E8F93;border-radius:10px;padding:10px 20px;background:#263748;color:#E7FFFF;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#14695F;border-color:#5AE3D3}#choices{display:flex;gap:9px;flex-wrap:wrap}.hint{font-size:13px} .state{font-size:12px;color:#7EE3D6}</style></head>
<body><header><h1>CARTDECK / GripArc V1</h1><p>Full-L housing never changes. G1 and G2 live down the side, G3 and G4 wrap along the bottom. All keys are shoulder/L–R sized. Inactive keys are absent, not dim.</p>
<div id="choices"><button data-side="right" aria-pressed="true">Right attachment</button><button data-side="left" aria-pressed="false">Left attachment</button></div><p class="hint">Asset geometry only. Native scale, safe Android placement, inputs, and per-game editor remain implementation work.</p></header>
<div class="grid" id="cards"></div>
<script>let side="right";const root=document.getElementById("cards");function show(){root.innerHTML=[1,2,3,4].map(n=>`<article class="card"><h2>${n} button${n===1?"":"s"}</h2><p class="state">${n===1?"G1":n===2?"G1 + G2":n===3?"G1 + G2 + G3":"G1 + G2 + G3 + G4"}</p><img alt="${side} full L GripArc with ${n} active L/R-sized buttons" src="griparc-${side}-${n}.svg"></article>`).join("")};document.querySelectorAll("[data-side]").forEach(b=>b.onclick=()=>{side=b.dataset.side;document.querySelectorAll("[data-side]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));show()});show();</script></body></html>
