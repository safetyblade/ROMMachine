<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 94 340" role="img" aria-label="CARTDECK Arc-Rail machined cartridge spine candidate v0.5.2">
<title>CARTDECK Arc-Rail machined spine</title>
