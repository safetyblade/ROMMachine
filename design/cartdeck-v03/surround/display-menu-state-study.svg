<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="795" viewBox="0 0 1280 795" role="img" aria-labelledby="title desc">
<title id="title">CARTDECK Display menu — Auto and Widescreen capability states, Standard and Ornamental surround selection</title>
<desc id="desc">Design-only editable visual study. Left panel shows Auto default and supported widescreen choice. Right panel shows unsupported widescreen disabled and Ornamental surround selected. Actual CARTDECK menu will use the existing native Compose GameMenuPanel.</desc>
<rect width="1280" height="795" fill="#0D121A"/>
<text x="42" y="48" fill="#EDF6F2" font-family="system-ui, sans-serif" font-weight="750" font-size="30">CARTDECK / DISPLAY</text>
<text x="42" y="79" fill="#99A9B1" font-family="system-ui, sans-serif" font-size="17">DESIGN V1  ·  RADIO CHOICES / CAPABILITY FEEDBACK / ACCESSIBLE CONTROLLER FOCUS</text>
<!-- The grey canvas behind each screen stands for the paused game under the native menu, never gameplay captured. -->
<g id="display-supported">
<rect x="42" y="115" width="579" height="615" rx="18" fill="#1D2630" stroke="#3B4C58" stroke-width="2"/>
<rect x="58" y="132" width="546" height="580" rx="15" fill="#273642" stroke="#4ED8C4" stroke-opacity=".65" stroke-width="2"/>
