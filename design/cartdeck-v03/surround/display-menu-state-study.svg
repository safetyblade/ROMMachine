<text x="82" y="239" font-size="15" fill="#BCC9CB" font-family="system-ui, sans-serif">Aspect ratio</text>
<rect x="78" y="256" width="504" height="84" rx="11" fill="#162B33" stroke="#4ED8C4" stroke-width="2.5"/>
<circle cx="110" cy="292" r="12" stroke="#4ED8C4" fill="none" stroke-width="2"/><circle cx="110" cy="292" r="6" fill="#4ED8C4"/>
<text x="136" y="289" font-size="21" fill="#EDF6F2" font-family="system-ui, sans-serif" font-weight="700">Auto</text>
<text x="136" y="318" font-size="13" fill="#A8BEC2" font-family="system-ui, sans-serif">Original proportions. Resets each launch.</text>
<rect x="78" y="351" width="504" height="84" rx="11" fill="#24313B" stroke="#657B86" stroke-width="1.5"/>
<circle cx="110" cy="389" r="12" stroke="#AFC7CA" fill="none" stroke-width="2"/>
<text x="136" y="384" font-size="21" fill="#EDF6F2" font-family="system-ui, sans-serif" font-weight="700">Widescreen</text>
<text x="136" y="413" font-size="13" fill="#A8BEC2" font-family="system-ui, sans-serif">Supported genuine widescreen mode.</text>
<text x="82" y="477" font-size="15" fill="#BCC9CB" font-family="system-ui, sans-serif">Surround</text>
<rect x="78" y="493" width="504" height="65" rx="11" fill="#162B33" stroke="#4ED8C4" stroke-width="2"/>
<circle cx="110" cy="525" r="12" stroke="#4ED8C4" fill="none" stroke-width="2"/><circle cx="110" cy="525" r="6" fill="#4ED8C4"/>
<text x="136" y="533" font-size="20" fill="#EDF6F2" font-family="system-ui, sans-serif" font-weight="650">Standard</text>
<rect x="78" y="565" width="504" height="65" rx="11" fill="#24313B" stroke="#657B86" stroke-width="1.5"/>
<circle cx="110" cy="597" r="12" stroke="#AFC7CA" fill="none" stroke-width="2"/>
