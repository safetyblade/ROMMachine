<text x="754" y="413" font-size="12" fill="#94A392" font-family="system-ui, sans-serif">Not verified for this game; Auto is preserved.</text>
<text x="700" y="482" font-size="15" fill="#CDDCC4" font-family="system-ui, sans-serif">Surround</text>
<rect x="696" y="493" width="504" height="65" rx="11" fill="#202723" stroke="#4E594D" stroke-width="1"/>
<circle cx="728" cy="525" r="12" stroke="#94AA89" fill="none" stroke-width="2"/>
<text x="754" y="533" font-size="20" fill="#F0F5E9" font-family="system-ui, sans-serif">Standard</text>
<rect x="696" y="565" width="504" height="65" rx="11" fill="#1B2A20" stroke="#9BC74A" stroke-width="2.5"/>
<circle cx="728" cy="597" r="12" stroke="#9BC74A" fill="none" stroke-width="2"/><circle cx="728" cy="597" r="6" fill="#9BC74A"/>
<text x="754" y="604" font-size="20" fill="#F0F5E9" font-family="system-ui, sans-serif" font-weight="650">Ornamental</text>
<text x="700" y="674" font-size="15" fill="#9BC74A" font-family="system-ui, sans-serif">RETURN TO GAME</text>
<text x="1180" y="674" text-anchor="end" font-size="15" fill="#B5C7B0" font-family="system-ui, sans-serif">BACK</text>
