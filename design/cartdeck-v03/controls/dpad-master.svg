<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="CARTDECK machined cross D-pad">
  <title>CARTDECK machined cross D-pad</title>
  <desc>Compact chamfered directional cross without circular mounting plate. Two discreet directional bars and a tactile centre hub, consistent with the approved Original and Pink device concepts.</desc>
  <!-- Single immutable cross silhouette. Appearance is selected by cosmetic edition tokens. -->
  <path id="cd-dpad-cross" data-cd-fill="button" data-cd-stroke="secondaryHi"
        d="M48 9 H80 L83 12 V44 H116 L119 47 V81 L116 84 H83 V116 L80 119 H48 L45 116 V84 H12 L9 81 V47 L12 44 H45 V12 Z"
        fill="#111923" stroke="#626F7A" stroke-width="2.7" stroke-linejoin="bevel"/>
  <path id="cd-dpad-upper-bar" data-cd-stroke="secondaryHi" d="M56 31 H72"
        fill="none" stroke="#626F7A" stroke-width="2.7" stroke-linecap="square"/>
  <path id="cd-dpad-lower-bar" data-cd-stroke="secondaryHi" d="M56 97 H72"
        fill="none" stroke="#626F7A" stroke-width="2.7" stroke-linecap="square"/>
  <circle id="cd-dpad-centre" data-cd-fill="button" data-cd-stroke="secondaryHi"
          cx="64" cy="64" r="7.1" fill="#111923" stroke="#626F7A" stroke-width="2.7"/>
</svg>
