<path id="cd-lower-seam" d="M35 419H358" fill="none" data-cd-stroke="secondary" stroke="#1C2430" stroke-width="2"/>
<path id="cd-corner-accents" d="M34 109L43 99M352 99L360 108M32 761L42 774M350 774L361 761" fill="none" data-cd-stroke="accent" stroke="#4ED8C4" stroke-opacity=".6" stroke-width="3"/>
