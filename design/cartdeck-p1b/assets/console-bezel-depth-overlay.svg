<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 393 852" role="img" aria-label="CARTDECK transparent shell and inset game aperture depth master">
<title>CARTDECK transparent console bezel overdraw - screen aperture is genuinely transparent</title>
<desc>Design-master overlay only: paint behind PadKit as noninteractive graphics, never fill the measured game viewport. Reconcile units with adaptive Compose constraints. Uses semantic palette slots and reuses the canonical C-slot as a separate brand component.</desc>
