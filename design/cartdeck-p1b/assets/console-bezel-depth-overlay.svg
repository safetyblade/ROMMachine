<path id="cd-bezel-machining" d="M50 122H342L366 145M50 400H342L366 377" fill="none" data-cd-stroke="secondary" stroke="#1C2430" stroke-width="4"/>
<path id="cd-upper-rim" d="M24 92L47 60H346L369 92" fill="none" data-cd-stroke="onChassis" stroke="#EDF6F2" stroke-opacity=".25" stroke-width="2" data-cd-effect-zone="outer-rim"/>
